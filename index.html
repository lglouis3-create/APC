  {t:'Use the pads of the fingers, not the thumb', correct:true, why:'Slide 31 says to use the pads of the fingers, which work better than the tips, and not the thumb.'},
  {t:'Use the tips of the fingers and the thumb', correct:false, why:'The pads work better than the tips, and the thumb is not used (slide 31).'},
  {t:'Press lightly so the artery is not compressed', correct:false, why:'Press hard enough to start to collapse the artery (slide 31).'},
  {t:'Use the ulnar side of the wrist', correct:false, why:'The radial pulse is on the radial (thumb) side of the wrist (slide 31).'}],
 teach:'Press over the artery until it begins to collapse, then adjust pressure if you cannot feel the pulse at first.',
 cite:'POCT-Physical-Assessment.pdf slide 31'},

{id:'p03', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'pulse-calculation',
 tags:['pulse'], source:'slide',
 stem:'A pulse is counted for 15 seconds and is 18 beats. What is the heart rate?',
 options:[
  {t:'72 beats/min', correct:true, why:'15 seconds multiplied by 4 gives a minute: 18 × 4 = 72 (slide 31); the TOSCE guide also allows a 15- or 30-second count.'},
  {t:'36 beats/min', correct:false, why:'Multiplies by 2, the factor for a 30-second count (slide 31).'},
  {t:'90 beats/min', correct:false, why:'Multiplies by 5, which is not the factor for a 15-second count (slide 31).'},
  {t:'18 beats/min', correct:false, why:'The 15-second count must be converted to a full minute (slide 31).'}],
 teach:'The minimum time is 15 seconds multiplied by 4, or 30 seconds multiplied by 2. Check: 18 × 4 = 72. If the result is close to the tachycardia or bradycardia cut-off, repeat for the full minute.',
 cite:'POCT-Physical-Assessment.pdf slide 31; TOSCE-Study-Guide.pdf slide 1'},

{id:'p04', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'respirations',
 tags:['respirations'], source:'slide',
 stem:'Which statement about measuring respirations is correct?',
 options:[
  {t:'Do not tell the patient; count at least 30 seconds', correct:true, why:'Slide 32 says do not tell the patient and the minimum time for inspection is 30 seconds.'},
  {t:'Tell the patient so they breathe at a normal pace', correct:false, why:'Slide 32 says do not tell the patient, so telling the patient is incorrect.'},
  {t:'Count for at least 10 seconds, then double it', correct:false, why:'Slide 32 gives a minimum of 30 seconds of inspection, not 10 seconds.'},
  {t:'Listen over the back with a stethoscope for a minute', correct:false, why:'Slide 32 says respirations are done by inspection, watching the rise and fall of the chest, not by listening.'}],
 teach:'Watch the rise and fall of the chest. Normal is 12–20 breaths/min; tachypnea is greater than 20 and bradypnea less than 12.',
 cite:'POCT-Physical-Assessment.pdf slide 32'},

{id:'p05', skill:'tell', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'vital-signs',
 tags:['vitals'], source:'slide',
 stem:'Which of these is a vital sign rather than a vital statistic?',
 options:[
  {t:'Oxygen saturation', correct:true, why:'Slide 29 lists pulse, respirations, blood pressure, temperature and O2 saturation as vital signs.'},
  {t:'Weight', correct:false, why:'Slide 29 lists weight with the vital statistics, not the vital signs.'},
  {t:'Smoking status', correct:false, why:'Slide 29 lists smoking status with the vital statistics, not the vital signs.'},
  {t:'Perception of pain', correct:false, why:'Slide 29 lists perception of pain with the vital statistics, not the vital signs.'}],
 teach:'Vital statistics: age, height, weight, medication allergies, smoking status and perception of pain.',
 cite:'POCT-Physical-Assessment.pdf slide 29'},

{id:'p06', skill:'tell', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'systematic-approach',
 tags:['physical assessment'], source:'slide',
 stem:'Feeling a patient’s radial pulse is which step of the systematic approach to physical assessment?',
 options:[
  {t:'Palpation', correct:true, why:'Slide 28 defines palpation as “what do I feel”, with pulse as the example.'},
  {t:'Inspection', correct:false, why:'Slide 28 defines inspection as what you see, such as coughing, not what you feel.'},
  {t:'Percussion', correct:false, why:'Slide 28 defines percussion as what you hear and feel; the pulse example is under palpation.'},
  {t:'Auscultation', correct:false, why:'Slide 28 defines auscultation as what you hear, such as a wheeze, not what you feel.'}],
 teach:'The approach: inspection, palpation, percussion, auscultation.',
 cite:'POCT-Physical-Assessment.pdf slide 28'},

{id:'p07', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'cuff-size',
 tags:['blood pressure'], source:'slide',
 stem:'A blood pressure cuff that is too small for the patient’s arm gives which effect on the reading?',
 options:[
  {t:'Overestimates the pressure', correct:true, why:'Slide 33 says a cuff that is too small overestimates the blood pressure.'},
  {t:'Underestimates the pressure', correct:false, why:'Slide 33 says a cuff that is too large or too loose underestimates the pressure.'},
  {t:'No effect if positioned at heart level', correct:false, why:'Slide 33 says an inappropriate cuff size affects the accuracy of the measurement.'},
  {t:'Reads the diastolic pressure only', correct:false, why:'Slide 33 describes only overestimating or underestimating effects of cuff size, not reading diastolic alone.'}],
 teach:'A cuff that is too large underestimates, and one that is too loose underestimates. Standard cuffs work for most adults.',
 cite:'POCT-Physical-Assessment.pdf slide 33'},

{id:'p08', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'bp-arm-position',
 tags:['blood pressure'], source:'slide',
 stem:'During a blood pressure measurement, how should the patient’s arm be positioned?',
 options:[
  {t:'At heart level, not supported by the patient', correct:true, why:'Slide 34: heart level, and the patient should not support their arm, since muscle tension can falsely elevate the reading.'},
  {t:'Held up by the patient at about shoulder height', correct:false, why:'The patient should not support the arm; muscle tension falsely elevates the reading (slide 34).'},
  {t:'Below heart level, hanging at the patient’s side', correct:false, why:'Slide 34 says the arm should be positioned at heart level, not below it.'},
  {t:'Raised above the head on a pillow', correct:false, why:'Slide 34 says the arm should be at heart level, not raised above the head.'}],
 teach:'The patient may sit, stand or lie down. The cuff may be placed over a shirt.',
 cite:'POCT-Physical-Assessment.pdf slides 34–35'},

{id:'p09', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'bp-prep',
 tags:['blood pressure'], source:'slide',
 stem:'Before a blood pressure measurement, the patient should avoid caffeine, smoking and exercise for at least how long?',
 options:[
  {t:'30 minutes', correct:true, why:'Slide 35 says the patient should avoid caffeine, smoking and exercise for at least 30 minutes.'},
  {t:'5 minutes', correct:false, why:'5 minutes is the wait before repeating a measurement (slide 37).'},
  {t:'60 minutes', correct:false, why:'Slide 35 gives at least 30 minutes of avoiding caffeine, smoking and exercise, not 60.'},
  {t:'2 hours', correct:false, why:'Slide 35 gives at least 30 minutes of avoiding caffeine, smoking and exercise, not 2 hours.'}],
 teach:'The patient sits comfortably with the arm at about heart level, palm up, feet flat on the floor, and relaxed.',
 cite:'POCT-Physical-Assessment.pdf slides 35, 37'},

{id:'p10', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'bp-technique',
 tags:['blood pressure'], source:'slide',
 stem:'In the auscultatory method, which sound marks the systolic and which the diastolic pressure?',
 options:[
  {t:'First tapping sound is systolic; last sound is diastolic', correct:true, why:'Slides 36–37: the first clear tapping sound is systolic and the last sound heard is diastolic.'},
  {t:'First tapping sound is diastolic; last sound is systolic', correct:false, why:'Slides 36–37 make the first tapping sound systolic and the last sound diastolic, so this reverses them.'},
  {t:'Both are read from the first tapping sound', correct:false, why:'Slide 37 says diastolic is the last sound heard, when the tapping sounds disappear.'},
  {t:'Both are read when the sounds begin to fade', correct:false, why:'Slide 36 says systolic is the first clear tapping sound, not when sounds fade.'}],
 teach:'Inflate rapidly to about 160–180 mmHg, deflate at about 2–3 mmHg per second, and place the stethoscope diaphragm over the brachial artery. If a repeat is warranted, wait 5 minutes.',
 cite:'POCT-Physical-Assessment.pdf slides 36–37'},

{id:'p11', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'bp-categories',
 tags:['blood pressure'], source:'slide',
 stem:'Which reading is in the hypertensive urgency range (180/110 mmHg or greater)?',
 options:[
  {t:'182/112 mmHg', correct:true, why:'Slide 38: hypertensive urgency is 180/110 mmHg or greater, and 182/112 meets both values.'},
  {t:'172/108 mmHg', correct:false, why:'Slide 38 puts 130/80 mmHg or greater in hypertension; 172/108 is below the 180/110 urgency cutoff.'},
  {t:'118/76 mmHg', correct:false, why:'Slide 38 lists normal as less than 120/80 mmHg, so 118/76 is not urgency.'},
  {t:'88/48 mmHg', correct:false, why:'Slide 38 lists hypotension as SBP below 90–100 or DBP below 50–60 mmHg, so 88/48 is not urgency.'}],
 teach:'From the ACC/AHA 2017 guidelines on slide 38: normal less than 120/80; hypertension 130/80 or greater; hypertensive urgency 180/110 or greater; hypotension systolic below 90–100 or diastolic below 50–60.',
 cite:'POCT-Physical-Assessment.pdf slide 38'},

{id:'p12', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'fever',
 tags:['temperature'], source:'slide',
 stem:'At or above which temperature is a fever defined?',
 options:[
  {t:'99.5 °F (37.5 °C)', correct:true, why:'Slide 39 defines fever as 99.5 °F (37.5 °C) or higher.'},
  {t:'98.6 °F (37.0 °C)', correct:false, why:'Slide 39 gives normal as 98.0–98.6 °F, below the fever cutoff.'},
  {t:'101.0 °F (38.3 °C)', correct:false, why:'Slide 39 sets fever at 99.5 °F (37.5 °C) or higher, not 101.0 °F.'},
  {t:'105.0 °F (40.5 °C)', correct:false, why:'Slide 39 lists above 105.0 °F as dangerous, not as the fever threshold.'}],
 teach:'Normal: 98.0–98.6 °F (36.7–37 °C). Fever: 99.5 °F (37.5 °C) or higher. Dangerous: above 105.0 °F (40.5 °C). Antipyretics, environment and warm or cold food or drink can affect the reading.',
 cite:'POCT-Physical-Assessment.pdf slide 39'},

{id:'p13', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'oximetry-ranges',
 tags:['pulse oximetry'], source:'slide',
 stem:'What pulse oximetry reading is normal, and under what value does a patient need medical attention?',
 options:[
  {t:'95% to 99% is normal; below 90% needs attention', correct:true, why:'Slide 40 says 95% to 99% is normal and below 90% needs medical attention.'},
  {t:'90% to 94% is normal; below 85% needs attention', correct:false, why:'Slide 40 gives 95% to 99% as normal and below 90% for attention, not 90%–94% and 85%.'},
  {t:'90% to 100% is normal; below 95% needs attention', correct:false, why:'Normal is 95% to 99%; attention is needed below 90% (slide 40).'},
  {t:'85% to 90% is normal; below 80% needs attention', correct:false, why:'Slide 40 gives 95% to 99% as normal and below 90% for attention, not 85%–90% and 80%.'}],
 teach:'The oximeter measures the oxygen saturation of arterial blood. The calculation of saturation is not needed for exams (slide 40).',
 cite:'POCT-Physical-Assessment.pdf slide 40'},

{id:'p14', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'oximetry-melanin',
 tags:['pulse oximetry'], source:'slide',
 stem:'A Black patient’s pulse oximeter reads normal, but the patient looks unwell. What does the pharmacist consider?',
 options:[
  {t:'Falsely high; use a lower threshold for the ER', correct:true, why:'Slide 41: oximeters can overestimate O2 saturation in Black patients; the ER can get an arterial blood gas.'},
  {t:'The reading is accurate in every skin tone', correct:false, why:'Melanin interferes with light transmission and absorption (slide 41).'},
  {t:'The reading is falsely low; repeat in 5 minutes', correct:false, why:'Slide 41 says oximeters give falsely high readings in Black patients, not falsely low ones.'},
  {t:'Skip the oximeter and measure temperature', correct:false, why:'Slide 41 advises a lower threshold for the ER, not a different vital sign.'}],
 teach:'Melanin absorbs more light and interferes with the oximeter. Falsely high readings can delay diagnosis and treatment.',
 cite:'POCT-Physical-Assessment.pdf slide 41'},

{id:'p15', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'oximetry-technique',
 tags:['pulse oximetry'], source:'slide',
 stem:'Which step belongs in preparing a patient for a pulse oximeter reading?',
 options:[
  {t:'Remove nail polish and warm cold hands', correct:true, why:'Slide 42: nails dry and clean; remove polish, acrylics or artificial tips; warm cold hands.'},
  {t:'Place the sensor on the thumb', correct:false, why:'Slide 42 places the oximeter on the fingertip of an index or middle finger, not the thumb.'},
  {t:'Take the reading as soon as a number appears', correct:false, why:'The patient should be still for at least a minute until the numbers are steady (slide 42).'},
  {t:'Leave acrylic nails on to hold the sensor', correct:false, why:'Slide 42 says to remove fingernail polish, acrylic nails and artificial tips before the reading.'}],
 teach:'Record the two numbers: oxygen saturation and heart rate.',
 cite:'POCT-Physical-Assessment.pdf slide 42'},

{id:'p16', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'swab', concept:'throat-swab',
 tags:['specimen collection'], source:'slide',
 stem:'In a throat swab, which structure is struck with the side of the swab?',
 options:[
  {t:'The uvula', correct:true, why:'Slide 46: follow the glossopalatine arch, striking the uvula with the side of the swab.'},
  {t:'The tongue', correct:false, why:'Slide 46 has the patient stick the tongue out and says the swab strikes the uvula, not the tongue.'},
  {t:'The hard palate', correct:false, why:'Slide 46 describes the swab path along the glossopalatine arch from tonsil to tonsil, not the hard palate.'},
  {t:'The inferior turbinate', correct:false, why:'Slide 51 places the inferior turbinate in the nose, so it is not part of the throat swab.'}],
 teach:'Start at the base of the arch at the level of the tonsil, follow the glossopalatine arch, strike the uvula, end at the opposite tonsil, then swab in reverse immediately.',
 cite:'POCT-Physical-Assessment.pdf slide 46'},

{id:'p17', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'swab', concept:'nasal-swab',
 tags:['specimen collection'], source:'slide',
 stem:'Which instruction applies to the nasal swab technique?',
 options:[
  {t:'The patient does not blow their nose beforehand', correct:true, why:'Slide 48 says to ensure the patient does not blow their nose prior to the procedure.'},
  {t:'Insert the swab about 4 inches to the turbinates', correct:false, why:'The cotton end is inserted to the turbinates, about 1 inch (slide 48).'},
  {t:'Do not rotate the swab', correct:false, why:'Rotate slightly so cells as well as mucus are collected (slide 48).'},
  {t:'Hold the patient’s chin with the dominant hand', correct:false, why:'The chin is held with the non-dominant hand; the swab is held in the dominant hand (slide 48).'}],
 teach:'Nostril technique: rotate 5 times with good contact and leave the swab in the nostril for 15 seconds; repeat in the other nostril if the manufacturer requires. A nasopharyngeal swab goes past the inferior meatus.',
 cite:'POCT-Physical-Assessment.pdf slides 48–51'},

{id:'p18', skill:'tell', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'tests', concept:'sens-spec',
 tags:['sensitivity','specificity'], source:'slide',
 stem:'Which statement defines specificity?',
 options:[
  {t:'The proportion of people without the disease who test negative', correct:true, why:'Slide 55 defines specificity as the proportion of individuals without the disease who test negative.'},
  {t:'The proportion of people with the disease who test positive', correct:false, why:'Slide 55 defines this as sensitivity: individuals with the disease who test positive.'},
  {t:'The proportion of all positive test results that are true positives', correct:false, why:'Slide 55 defines only sensitivity and specificity; the share of positives that are true positives is not specificity.'},
  {t:'The proportion of people tested who have the disease', correct:false, why:'Slide 55 defines specificity among individuals without the disease, not the proportion of those tested who have it.'}],
 teach:'High specificity makes a test good at ruling out disease; high sensitivity makes it good at detecting disease.',
 cite:'POCT-Physical-Assessment.pdf slides 54–55'},

{id:'p19', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'tests', concept:'screening-sensitivity',
 tags:['sensitivity','screening'], source:'slide',
 stem:'A pharmacy screens many people for HIV or hepatitis C, and most will not have the disease. Which test property is needed?',
 options:[
  {t:'High sensitivity', correct:true, why:'Slide 57 says screening needs high sensitivity because you do not want to miss patients.'},
  {t:'High specificity only', correct:false, why:'Slide 57 calls for a test with high sensitivity, not high specificity only.'},
  {t:'A long processing time', correct:false, why:'Time is a logistical consideration (slide 56), not the property needed.'},
  {t:'No confirmatory testing', correct:false, why:'A good referral program for confirmatory testing is needed (slide 57).'}],
 teach:'Screening casts a wide net to find a few patients, so counseling about results and referral for confirmation are essential.',
 cite:'POCT-Physical-Assessment.pdf slide 57'},

{id:'p20', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'tests', concept:'clia-waived',
 tags:['test selection'], source:'slide',
 stem:'Which logistical consideration is required when choosing a point-of-care test?',
 options:[
  {t:'The test must be CLIA-waived', correct:true, why:'Slide 56 lists “Need a CLIA-waived test” first among the logistical considerations.'},
  {t:'It must use only a nasopharyngeal swab', correct:false, why:'Throat, nasal and nasopharyngeal collection are all options (slide 56).'},
  {t:'It must be free to the patient', correct:false, why:'Cost and reimbursement are considered, not required to be free (slide 56).'},
  {t:'It must take over an hour', correct:false, why:'Time required is a consideration, with no minimum (slide 56).'}],
 teach:'Other logistical considerations: cost and reimbursement, specimen collection method, specimen processing space and training, and time.',
 cite:'POCT-Physical-Assessment.pdf slide 56'},

{id:'p21', skill:'apply', prof:'Dr. Parsons', multi:true, tier:'new', topic:'poct', sub:'tests', concept:'gas-flu-testing',
 tags:['influenza','strep'], source:'slide',
 stem:'Which are appropriate practices for Group A strep or influenza point-of-care testing? Select all that apply.',
 options:[
  {t:'Test only patients with symptoms consistent with the disease', correct:true, why:'Slide 58 says to only test patients with symptoms consistent with the disease.'},
  {t:'Test for influenza only when documented disease activity is in the community', correct:true, why:'Slide 58 says to only test for influenza when there is documented disease activity in the community.'},
  {t:'Test every patient who walks in', correct:false, why:'Slide 58 limits testing to patients with symptoms consistent with the disease, not every patient.'},
  {t:'Ignore specificity when choosing the test', correct:false, why:'A test with poor specificity could lead to unnecessary courses of treatment (slide 58).'}],
 teach:'The Centor score is not needed for exams (slide 58).',
 cite:'POCT-Physical-Assessment.pdf slide 58'},

{id:'p22', skill:'recall', prof:'Dr. Parsons', multi:true, tier:'new', topic:'poct', sub:'tests', concept:'protocol-contents',
 tags:['protocol'], source:'slide',
 stem:'A POCT service protocol defines which of these? Select all that apply.',
 options:[
  {t:'The patient population for the service', correct:true, why:'Slide 60 lists the patient population for the service among the protocol contents.'},
  {t:'Inclusion and exclusion criteria', correct:true, why:'Slide 60 lists inclusion and exclusion criteria among the protocol contents.'},
  {t:'The test and collection technique to be used', correct:true, why:'Slide 60 lists the test and collection technique to be used among the protocol contents.'},
  {t:'Post-testing therapy or referral', correct:true, why:'Slide 60 lists defined post-testing therapy or referral among the protocol contents.'},
  {t:'How results are communicated', correct:true, why:'Slide 60 lists defined communication of testing results among the protocol contents.'},
  {t:'The pharmacy’s reimbursement rate', correct:false, why:'Reimbursement is a test-selection consideration (slide 56), not part of the protocol list on slide 60.'}],
 teach:'A protocol, which may be part of a collaborative agreement, also includes the clinical information or algorithm.',
 cite:'POCT-Physical-Assessment.pdf slides 56, 60'}
);

/* ==========================================================================
   Week 6: Dr. Parsons, Immunizations. Sources: Immunizations-Pre-Lab.pdf (the
   deck), the 9/21 transcript marked (T), and AAFP-Adult-Schedule-2026.pdf (the
   2026 schedule, text read from Drive; its colors cannot be read from the
   text, so no item keys a color except where the transcript names it).
   Dr. Parsons said the PDF schedule will be available on exams and that the
   Notes section must be used, so items here ask for the rule the schedule
   gives. She also said the source-credibility terms (convergent evidence,
   body of evidence, meta-analysis, systematic review) need not be memorized.
   ========================================================================== */
QUESTIONS.push(
/* ---- using the schedule ----------------------------------------------- */
{id:'i01', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sched', concept:'schedule-order',
 tags:['AAFP schedule'], source:'both',
 stem:'In what order are the parts of the AAFP adult immunization schedule used?',
 options:[
  {t:'Age, medical conditions, Notes, Appendix, Addendum', correct:true, why:'Slide 8 and the schedule’s “How to use” box: vaccines by age, medical conditions, Notes, Appendix, then Addendum.'},
  {t:'Notes, age, medical conditions, Appendix, and Addendum', correct:false, why:'Slide 8 lists Vaccines by Age first, so starting with the Notes skips Tables 1 and 2.'},
  {t:'Age, Notes, medical conditions, Addendum, and Appendix', correct:false, why:'Medical conditions (Table 2) come before the Notes, and the Appendix before the Addendum (slide 8).'},
  {t:'Medical conditions, age, Appendix, Notes, and Addendum', correct:false, why:'Slide 8 puts Vaccines by Age first and the Notes third, so starting with medical conditions is out of order.'}],
 teach:'(1) Vaccines by age, Table 1. (2) Medical conditions, Table 2. (3) Notes. (4) Appendix: contraindications and precautions. (5) Addendum: new or updated guidance.',
 cite:'Immunizations-Pre-Lab.pdf slide 8; AAFP-Adult-Schedule-2026.pdf'},

{id:'i02', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sched', concept:'schedule-conditions-missed',
 tags:['AAFP schedule'], source:'both',
 stem:'Which part of the schedule do providers most often miss, so the pharmacist should focus on it?',
 options:[
  {t:'Vaccines by medical condition', correct:true, why:'Slide 8 marks medical conditions as often missed by providers; (T) age-based vaccines are done reasonably well.'},
  {t:'Vaccines by age', correct:false, why:'(T) Dr. Parsons said providers do a reasonably good job with vaccines by age, so this is not the step missed.'},
  {t:'The vaccine trade-name and abbreviation list', correct:false, why:'Slide 8 marks only the medical-conditions step as often missed by providers, not the trade-name list.'},
  {t:'The Addendum of new or updated guidance', correct:false, why:'Slide 8 describes the Addendum as new or updated guidance, not the step providers often miss.'}],
 teach:'(T) A patient with lupus on immunosuppressants developed shingles at 40 because a vaccine was missed; special situations get missed across specialists, so pharmacists should own them.',
 cite:'Immunizations-Pre-Lab.pdf slide 8; 9/21 transcript (T)'},

{id:'i03', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sched', concept:'schedule-notes-exams',
 tags:['AAFP schedule','exam'], source:'both',
 stem:'Which statement about the AAFP schedule on exams is correct?',
 options:[
  {t:'The PDF schedule is provided; use the Notes', correct:true, why:'Slides 8 and 17; (T) a right answer cannot be reached without the Notes.'},
  {t:'Students must memorize every dose interval for the exam', correct:false, why:'The schedule is provided on exams (slide 17), so intervals are read from it rather than recalled.'},
  {t:'Any website may be used to answer the questions', correct:false, why:'Slide 17 says the PDF schedule is provided on exams, and (T) students use that schedule, not another website.'},
  {t:'Only Table 1 is needed to answer any question', correct:false, why:'Slide 8 says the Notes must be used on exams and medical conditions (Table 2) are often missed; (T) a right answer cannot be reached without the Notes.'}],
 teach:'(T) Skim the Notes regularly to get a global impression of the risk factors and special situations for each vaccine.',
 cite:'Immunizations-Pre-Lab.pdf slides 8, 17; 9/21 transcript (T)'},

{id:'i04', skill:'recall', type:'match', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sched', concept:'table1-legend',
 tags:['AAFP schedule'], source:'both',
 stem:'Match each Table 1 category to what it means for the recommendation.',
 left:'Table 1 category', right:'What to do',
 pairs:[
  {l:'Recommended for adults who meet the age requirement', r:'Give the vaccine', why:'Table 1 legend; (T) this is the one you give.'},
  {l:'Recommended with an additional risk factor or another indication', r:'Read the Notes for the indication', why:'Table 1 legend; (T) read the Notes to see whether the patient has another risk factor.'},
  {l:'Recommended based on shared clinical decision-making', r:'Decide with the patient; evidence is mixed', why:'Table 1 legend; (T) evidence mixed, or vaccinate if risk factors now exist.'},
  {l:'No recommendation or not applicable', r:'Do not give', why:'Table 1 legend; (T) there is no body of evidence.'}],
 teach:'(T) Example: HPV at 27–45 years is shared decision-making; a 28-year-old who now has risk factors should be vaccinated. Tables 1 and 2 have different legends; read the one at the bottom of each.',
 cite:'AAFP-Adult-Schedule-2026.pdf; Immunizations-Pre-Lab.pdf slide 11; 9/21 transcript (T)'},

{id:'i05', skill:'tell', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sched', concept:'abbrev-flu',
 tags:['abbreviations','trade names'], source:'both',
 stem:'Which abbreviation and trade name pair is correct for the live attenuated influenza vaccine?',
 options:[
  {t:'LAIV3: FluMist', correct:true, why:'AAFP vaccine list: Influenza vaccine (live, attenuated) LAIV3 FluMist.'},
  {t:'RIV3: FluMist', correct:false, why:'AAFP vaccine list: RIV3 is the recombinant influenza vaccine, Flublok, not FluMist.'},
  {t:'ccIIV3: FluMist', correct:false, why:'AAFP vaccine list: ccIIV3 is the cell culture-based inactivated vaccine, Flucelvax, not FluMist.'},
  {t:'IIV3: Flublok', correct:false, why:'AAFP vaccine list: IIV3 is the egg-based inactivated vaccine, and Flublok is RIV3.'}],
 teach:'(T) You need to know the abbreviations, which vaccines are live and which inactivated, and the trade names. LAIV3 is the live vaccine; the others in this group are inactivated or recombinant.',
 cite:'AAFP-Adult-Schedule-2026.pdf; Immunizations-Pre-Lab.pdf slide 6; 9/21 transcript (T)'},

{id:'i06', skill:'recall', type:'match', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sched', concept:'trade-pneumo-zoster',
 tags:['abbreviations','trade names'], source:'slide',
 stem:'Match each vaccine to its trade name.',
 left:'Vaccine', right:'Trade name',
 pairs:[
  {l:'PCV15', r:'Vaxneuvance', why:'AAFP vaccine list.'},
  {l:'PCV20', r:'Prevnar 20', why:'AAFP vaccine list.'},
  {l:'PCV21', r:'Capvaxive', why:'AAFP vaccine list.'},
  {l:'PPSV23', r:'Pneumovax 23', why:'AAFP vaccine list.'},
  {l:'RZV', r:'Shingrix', why:'AAFP vaccine list.'},
  {l:'RSV (pregnancy)', r:'Abrysvo', why:'AAFP RSV pregnancy note: 1 dose Abrysvo.'}],
 teach:'Pneumococcal conjugate vaccines are PCV15, PCV20 and PCV21; the polysaccharide vaccine is PPSV23. RZV is the recombinant zoster vaccine.',
 cite:'AAFP-Adult-Schedule-2026.pdf'},

{id:'i07', skill:'recall', type:'match', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sched', concept:'trade-misc',
 tags:['abbreviations','trade names'], source:'slide',
 stem:'Match each vaccine to its trade name.',
 left:'Vaccine', right:'Trade name',
 pairs:[
  {l:'Tdap', r:'Boostrix', why:'AAFP vaccine list (Adacel also).'},
  {l:'Td', r:'Tenivac', why:'AAFP vaccine list.'},
  {l:'HPV', r:'Gardasil 9', why:'AAFP vaccine list.'},
  {l:'MenACWY-CRM', r:'Menveo', why:'AAFP vaccine list.'},
  {l:'MenB-4C', r:'Bexsero', why:'AAFP vaccine list.'},
  {l:'Mpox', r:'Jynneos', why:'AAFP vaccine list.'}],
 teach:'Several vaccines have more than one trade name; the AAFP list shows Tdap as Adacel or Boostrix.',
 cite:'AAFP-Adult-Schedule-2026.pdf'},

{id:'i08', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sched', concept:'acip',
 tags:['ACIP'], source:'both',
 stem:'What is the Advisory Committee on Immunization Practices (ACIP)?',
 options:[
  {t:'A CDC subcommittee that recommends vaccines', correct:true, why:'Slide 4: recommendations are forwarded to the CDC Director and, once adopted, become official CDC policy.'},
  {t:'A committee within the AAFP that writes its own schedule', correct:false, why:'The AAFP is a physician-led society (slide 5), separate from ACIP.'},
  {t:'A part of the FDA that approves new vaccines for use', correct:false, why:'Slide 4 describes ACIP as a subcommittee of the CDC, not part of the FDA.'},
  {t:'A state board that licenses pharmacists to vaccinate', correct:false, why:'Slide 4 describes ACIP as making recommendations forwarded to the CDC Director, not licensing vaccinators.'}],
 teach:'ACIP has regularly scheduled public meetings, for example on eligibility, timing and number of doses. Other societies, including the AAFP, American Academy of Pediatrics and ACOG, also issue recommendations.',
 cite:'Immunizations-Pre-Lab.pdf slides 4–5; 9/21 transcript (T)'},

{id:'i09', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sched', concept:'vaccine-resources',
 tags:['resources'], source:'slide',
 stem:'A pharmacist needs a patient handout and a contraindication screening form for a vaccine. Which resource supplies them?',
 options:[
  {t:'Immunize.org', correct:true, why:'Slide 6: vaccine information sheets, screening checklists, news and updates.'},
  {t:'CDC Yellow Book', correct:false, why:'Slide 6 lists the CDC Yellow Book for travel vaccines, not for handouts or screening forms.'},
  {t:'The Addendum of the AAFP schedule', correct:false, why:'Slide 8 describes the Addendum as new or updated guidance, not a source of handouts or screening forms.'},
  {t:'The ACIP meeting minutes', correct:false, why:'Slide 6 does not list ACIP meeting minutes as a source of patient handouts or screening checklists.'}],
 teach:'(T) The .org shows Immunize.org is a nonprofit organization, though that does not mean there are no financial interests.',
 cite:'Immunizations-Pre-Lab.pdf slides 6, 8; 9/21 transcript (T)'},

{id:'i10', skill:'apply', prof:'Dr. Parsons', multi:true, tier:'new', topic:'imm', sub:'vax', concept:'hepa-who',
 tags:['hepatitis A'], source:'both',
 stem:'Which patients should receive hepatitis A vaccine if not fully vaccinated? Select all that apply.',
 options:[
  {t:'A patient with HIV', correct:true, why:'Slide 16: give hepatitis A vaccine to all patients with HIV who are not fully vaccinated.'},
  {t:'A patient with chronic liver disease', correct:true, why:'Slide 16: give hepatitis A vaccine to all patients with chronic liver disease.'},
  {t:'A patient with alcoholism', correct:true, why:'Slide 16: give hepatitis A vaccine to all patients with alcoholism.'},
  {t:'Any patient who requests it', correct:true, why:'Slide 16; AAFP Notes: identification of a risk factor is not required.'},
  {t:'Every patient 40 years old', correct:false, why:'Neither slide 16 nor the AAFP Notes lists age 40 alone as an indication for hepatitis A vaccine.'}],
 teach:'(T) Also give it to patients listed in the Notes under special situations, as long as the screening checklist shows no contraindication.',
 cite:'Immunizations-Pre-Lab.pdf slides 14–16; AAFP-Adult-Schedule-2026.pdf'},

{id:'i11', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'hepa-pregnancy',
 tags:['hepatitis A','pregnancy'], source:'both',
 stem:'A pregnant patient has no risk factor and has not asked for hepatitis A vaccine. Is it routinely indicated?',
 options:[
  {t:'No, only if she is in a risk group', correct:true, why:'Slide 14: pregnant patients get it if in one of the special situations; (T) not all pregnant patients.'},
  {t:'Yes, it is routine for every pregnant patient', correct:false, why:'(T) You do not do it for all pregnant patients, only those in a risk bucket.'},
  {t:'No, because live vaccines are contraindicated', correct:false, why:'Slide 14: the hepatitis A vaccine is not a live vaccine, so that rule does not apply.'},
  {t:'Yes, but only after delivery for everyone', correct:false, why:'Slide 14 allows it in pregnancy for patients in a risk group.'}],
 teach:'Hepatitis A vaccine is not a live vaccine. Separately, any person not fully vaccinated who requests it can receive it without identifying a risk factor (slide 16; AAFP Notes).',
 cite:'Immunizations-Pre-Lab.pdf slides 14, 16; 9/21 transcript (T)'},

{id:'i12', skill:'apply', prof:'Dr. Parsons', multi:true, tier:'new', topic:'imm', sub:'contra', concept:'pregnancy-contraindicated',
 tags:['pregnancy','contraindications'], source:'both',
 stem:'Which vaccines are contraindicated in pregnancy? Select all that apply.',
 options:[
  {t:'Measles, mumps and rubella (MMR)', correct:true, why:'AAFP Appendix lists pregnancy as a contraindication to MMR.'},
  {t:'Varicella (VAR)', correct:true, why:'AAFP Appendix lists pregnancy as a contraindication to varicella vaccine.'},
  {t:'Live attenuated influenza (LAIV3)', correct:true, why:'AAFP Appendix lists pregnancy as a contraindication to LAIV3, the live attenuated influenza vaccine.'},
  {t:'Hepatitis A', correct:false, why:'Slide 14: hepatitis A vaccine is not live and is given in pregnancy to patients in a special situation.'},
  {t:'Tdap', correct:false, why:'One dose of Tdap is recommended in each pregnancy (AAFP Notes).'}],
 teach:'After pregnancy and before discharge from the facility, a patient without evidence of rubella or varicella immunity gets the missing dose.',
 cite:'AAFP-Adult-Schedule-2026.pdf Appendix; Immunizations-Pre-Lab.pdf slide 14'},

{id:'i13', skill:'tell', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'contra', concept:'contra-vs-precaution',
 tags:['contraindications'], source:'slide',
 stem:'What is the difference between a contraindication and a precaution in the AAFP Appendix?',
 options:[
  {t:'Contraindication: do not give; precaution: usually defer', correct:true, why:'Appendix footnotes 1 and 2: a contraindication means the vaccine should NOT be administered; a precaution means vaccination should generally be deferred.'},
  {t:'A contraindication is permanent; a precaution is a warning only', correct:false, why:'The footnotes define precautions as generally deferred but possibly indicated if benefit outweighs risk.'},
  {t:'Both mean the vaccine is never given', correct:false, why:'A precaution may still lead to vaccination if the benefit of protection outweighs the risk.'},
  {t:'A precaution applies only to live vaccines', correct:false, why:'Moderate or severe acute illness is a precaution for every vaccine listed in the Appendix.'}],
 teach:'Contraindications and precautions are listed per vaccine in the Appendix, which comes after the Notes in the order of use.',
 cite:'AAFP-Adult-Schedule-2026.pdf Appendix; Immunizations-Pre-Lab.pdf slide 8'},

{id:'i14', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'contra', concept:'acute-illness',
 tags:['precautions'], source:'both',
 stem:'A patient with a moderate or severe acute illness, with or without fever, comes for a vaccine. What does the schedule treat this as?',
 options:[
  {t:'A precaution; assess severity first', correct:true, why:'AAFP Appendix lists it as a precaution for each vaccine; (T) the lecturer assesses how sick the patient is, so the vaccine is not blamed if the patient needs a doctor or hospital.'},
  {t:'A contraindication for all vaccines', correct:false, why:'It is in the precautions column, so vaccination may be deferred but not always refused (Appendix footnote 2).'},
  {t:'No concern; vaccinate every patient who asks', correct:false, why:'It is a listed precaution for every vaccine in the Appendix.'},
  {t:'A contraindication for live vaccines only', correct:false, why:'It is a precaution for inactivated and live vaccines alike (Appendix).'}],
 teach:'(T) A moderate or severe illness is deferred so that, if the patient needs a doctor or hospital, the vaccine is not a possible cause of the problem.',
 cite:'AAFP-Adult-Schedule-2026.pdf Appendix; 9/21 transcript (T)'},

{id:'i15', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'contra', concept:'anaphylaxis-contra',
 tags:['contraindications'], source:'slide',
 stem:'A patient had anaphylaxis after a previous dose of Tdap. What does the AAFP Appendix say for Tdap?',
 options:[
  {t:'It is contraindicated; do not give it', correct:true, why:'Appendix, Tdap: severe allergic reaction (for example anaphylaxis) after a previous dose or to a vaccine component is a contraindication.'},
  {t:'It is a precaution; vaccinate in 4 weeks', correct:false, why:'It is a contraindication, so the vaccine should not be administered (Appendix footnote 1).'},
  {t:'It is allowed with a reduced dose', correct:false, why:'The AAFP Appendix lists severe allergic reaction to Tdap as a contraindication and gives no reduced-dose option.'},
  {t:'It is allowed if the patient waits 30 minutes', correct:false, why:'The AAFP Appendix gives no 30-minute wait that makes Tdap acceptable after anaphylaxis.'}],
 teach:'The screening questionnaire lists next steps if the patient screens positive (T).',
 cite:'AAFP-Adult-Schedule-2026.pdf Appendix; 9/21 transcript (T)'},

{id:'i16', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'hepb-dialysis',
 tags:['hepatitis B','dialysis'], source:'slide',
 stem:'A patient starting dialysis needs hepatitis B vaccine. Which regimen do the Notes give for the dialysis formulation (1 mL = 40 mcg)?',
 options:[
  {t:'Recombivax HB, 3 doses at 0, 1 and 6 months', correct:true, why:'AAFP Notes: patients on dialysis can get a 3-dose series of Recombivax HB (dialysis formulation) at 0, 1 and 6 months.'},
  {t:'Engerix-B 4 doses at 0, 1, 2 and 6 months, with a 2 mL dose', correct:false, why:'The Engerix-B dialysis series is 4 doses using a 2 mL dose, not the 40 mcg/1 mL dialysis formulation of Recombivax HB (AAFP Notes).'},
  {t:'Heplisav-B 2 doses 4 weeks apart', correct:false, why:'Heplisav-B is not named in the dialysis notes; the dialysis options are the 3- and 4-dose series (AAFP Notes).'},
  {t:'Twinrix 3 doses at 0, 1 and 6 months', correct:false, why:'Twinrix combines hepatitis A and B; the dialysis notes name Recombivax HB or Engerix-B.'}],
 teach:'Patients on dialysis complete a 3- or 4-dose series. Engerix-B uses a 2 mL dose instead of the normal adult 1 mL.',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (hepatitis B)'},

{id:'i17', skill:'tell', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'hepa-products',
 tags:['hepatitis A'], source:'slide',
 stem:'Which hepatitis A product is given as 2 doses, with dose 2 anywhere from 6 to 18 months after dose 1?',
 options:[
  {t:'Vaqta', correct:true, why:'AAFP Notes: Vaqta is a 2-dose series with dose 2 given 6–18 months after dose 1.'},
  {t:'Havrix', correct:false, why:'AAFP Notes: Havrix dose 2 is given 6–12 months after dose 1, a narrower window than Vaqta.'},
  {t:'Twinrix', correct:false, why:'Twinrix is a 3-dose series at 0, 1 and 6 months (AAFP Notes).'},
  {t:'Engerix-B', correct:false, why:'AAFP vaccine list: Engerix-B is a hepatitis B vaccine, not a hepatitis A product.'}],
 teach:'Any person not fully vaccinated who requests hepatitis A vaccine can get Havrix or Vaqta (2 doses) or Twinrix (3 doses).',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (hepatitis A)'},

{id:'i18', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'pneumo-after-ppsv23',
 tags:['pneumococcal'], source:'slide',
 stem:'A 65-year-old patient received only PPSV23 more than a year ago. Which is recommended?',
 options:[
  {t:'1 dose of PCV15, PCV20 or PCV21', correct:true, why:'AAFP Notes: previously received only PPSV23, 1 dose of PCV15, PCV20 or PCV21 at least 1 year after the last PPSV23.'},
  {t:'Repeat PPSV23 now', correct:false, why:'AAFP Notes: after PPSV23 alone, give a conjugate vaccine (PCV15, PCV20 or PCV21), not another PPSV23.'},
  {t:'No further pneumococcal vaccine', correct:false, why:'AAFP Notes: a patient with only PPSV23 still needs 1 conjugate dose, so pneumococcal vaccination is not complete.'},
  {t:'PCV20 followed by PPSV23 in 1 year', correct:false, why:'After PCV20 or PCV21 no further dose is needed; PPSV23 follows only PCV15 in other pathways (AAFP Notes).'}],
 teach:'If PCV15 is used for a patient with PPSV23 only, no additional PPSV23 is recommended. Adults who have received PCV20 or PCV21 need no additional pneumococcal vaccine.',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (pneumococcal)'},

{id:'i19', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'pneumo-none-before',
 tags:['pneumococcal'], source:'slide',
 stem:'A 55-year-old has never had a pneumococcal vaccine, and PCV15 is chosen. What follows?',
 options:[
  {t:'1 dose of PPSV23 a year after PCV15', correct:true, why:'AAFP Notes: if PCV15 is used, give 1 dose PPSV23 1 year after the PCV15 dose.'},
  {t:'Nothing; pneumococcal vaccination is complete', correct:false, why:'AAFP Notes: PCV20 or PCV21 completes the series, but after PCV15 a PPSV23 dose 1 year later is still due.'},
  {t:'A second PCV15 in 8 weeks', correct:false, why:'AAFP Notes: after PCV15 the follow-up is 1 dose of PPSV23, not a second PCV15 dose.'},
  {t:'PPSV23 on the same day', correct:false, why:'The Notes say 1 year after PCV15 (a minimum of 8 weeks only for immunocompromising conditions, cochlear implant or CSF leak).'}],
 teach:'Age 50 or older with no previous PCV: 1 dose PCV15, PCV20 or PCV21. PCV20 or PCV21 completes the series.',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (pneumococcal)'},

{id:'i20', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'rzv-dosing',
 tags:['zoster'], source:'both',
 stem:'A 52-year-old receives the first dose of Shingrix (RZV) today. When is dose 2?',
 options:[
  {t:'2 to 6 months later', correct:true, why:'AAFP Notes and slide 22: 2-dose series 2–6 months apart (minimum interval 4 weeks).'},
  {t:'1 year later', correct:false, why:'Slide 22 and the AAFP Notes give dose 2 at 2–6 months, not 1 year, after dose 1.'},
  {t:'2 to 6 weeks later', correct:false, why:'The minimum interval is 4 weeks, but the standard is 2–6 months (AAFP Notes).'},
  {t:'None; one dose is enough', correct:false, why:'AAFP Notes: RZV is a 2-dose series, so one dose does not complete it.'}],
 teach:'RZV is recommended at 50 or older regardless of previous herpes zoster or zoster vaccine live (Zostavax).',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (zoster); Immunizations-Pre-Lab.pdf slide 22'},

{id:'i21', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'rzv-immunocompromised',
 tags:['zoster'], source:'both',
 stem:'A 40-year-old with lupus takes an immunosuppressant. Is Shingrix (RZV) recommended?',
 options:[
  {t:'Yes, as a 2-dose series', correct:true, why:'AAFP Notes: special situations, immunocompromising conditions, 2-dose RZV; (T) her lupus patient had shingles at 40 without the vaccine.'},
  {t:'No, RZV is not given until age 50 for anyone', correct:false, why:'AAFP Table 1 and Notes recommend RZV for immunocompromising conditions before age 50, so age 50 is not required.'},
  {t:'No, a live zoster vaccine is given instead', correct:false, why:'AAFP Notes recommend RZV (Shingrix), the recombinant zoster vaccine; the live zoster vaccine (ZVL, Zostavax) appears in the Notes only as prior history.'},
  {t:'Yes, but a single dose is enough', correct:false, why:'AAFP Notes: RZV for immunocompromising conditions is a 2-dose series, not 1 dose.'}],
 teach:'(T) Immunosuppressed patients are often missing vaccines they should have had before the immunosuppressant was started.',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (zoster); 9/21 transcript (T)'},

{id:'i22', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'rsv-pregnancy',
 tags:['RSV','pregnancy'], source:'slide',
 stem:'A patient is 33 weeks pregnant in October. Which RSV vaccine recommendation applies?',
 options:[
  {t:'1 dose of Abrysvo', correct:true, why:'AAFP Notes: 32 weeks 0 days through 36 weeks 6 days, September through January, 1 dose Abrysvo.'},
  {t:'1 dose of Arexvy', correct:false, why:'AAFP Notes name Arexvy for adults 75 or older; in pregnancy only Abrysvo is named.'},
  {t:'None; RSV vaccine is not recommended in pregnancy', correct:false, why:'AAFP Notes recommend RSV vaccine in pregnancy at 32 weeks 0 days through 36 weeks 6 days, September through January.'},
  {t:'2 doses 4 weeks apart', correct:false, why:'AAFP Notes give 1 dose of Abrysvo in pregnancy, not 2 doses 4 weeks apart.'}],
 teach:'Either maternal Abrysvo or infant nirsevimab or clesrovimab is recommended to prevent severe RSV in infants. Additional doses in later pregnancies are not recommended.',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (RSV)'},

{id:'i23', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'rsv-older',
 tags:['RSV'], source:'slide',
 stem:'A 77-year-old has never had an RSV vaccine. What is recommended?',
 options:[
  {t:'1 dose of Arexvy, Abrysvo or mResvia', correct:true, why:'AAFP Notes: age 75 or older, unvaccinated, 1 dose; additional doses not recommended.'},
  {t:'An annual RSV dose', correct:false, why:'AAFP Notes: after 1 dose in an unvaccinated adult, additional RSV doses are not recommended, so no annual dose.'},
  {t:'Only if she has a risk factor', correct:false, why:'The risk-factor requirement applies to ages 50–74 (AAFP Notes).'},
  {t:'None; RSV vaccine is for pregnancy only', correct:false, why:'AAFP Notes recommend 1 dose of RSV vaccine for unvaccinated adults 75 or older, not only in pregnancy.'}],
 teach:'Age 50–74 is vaccinated only if at increased risk of severe RSV disease (such as chronic lung or heart disease).',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (RSV)'},

{id:'i24', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'tdap-pregnancy',
 tags:['Tdap','pregnancy'], source:'slide',
 stem:'How often is Tdap recommended in pregnancy?',
 options:[
  {t:'1 dose per pregnancy, weeks 27–36', correct:true, why:'AAFP Notes: 1 dose Tdap during each pregnancy, preferably early in gestational weeks 27–36.'},
  {t:'1 dose only in the first pregnancy', correct:false, why:'AAFP Notes: 1 dose of Tdap is recommended during each pregnancy, not only the first.'},
  {t:'No dose; Td is used', correct:false, why:'If a tetanus-toxoid vaccine is indicated for a pregnant woman, use Tdap (AAFP Notes).'},
  {t:'2 doses 4 weeks apart', correct:false, why:'AAFP Notes: Tdap in pregnancy is a single dose each pregnancy, not 2 doses 4 weeks apart.'}],
 teach:'If a tetanus-toxoid vaccine is indicated for a pregnant woman, use Tdap (AAFP Notes).',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (Tdap)'},

{id:'i25', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'tetanus-wound',
 tags:['Td','wound'], source:'slide',
 stem:'A patient with 3 or more previous tetanus doses has a deep puncture wound; the last dose was 7 years ago. What is recommended?',
 options:[
  {t:'Tdap or Td, since more than 5 years have passed', correct:true, why:'AAFP Notes: for wounds other than clean and minor, give Tdap or Td if more than 5 years since the last dose.'},
  {t:'No vaccine; less than 10 years since the last dose', correct:false, why:'AAFP Notes: the 10-year interval applies to clean and minor wounds; this deep puncture wound uses 5 years.'},
  {t:'A 3-dose primary series', correct:false, why:'The patient has completed a primary series (3 or more doses).'},
  {t:'Tdap only if pregnant', correct:false, why:'AAFP Notes: Tdap or Td for a wound depends on the interval since the last dose, not on pregnancy.'}],
 teach:'Adults who have completed the primary series need Td or Tdap every 10 years after the first Tdap.',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (tetanus)'},

{id:'i26', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'contra', concept:'mmr-hiv',
 tags:['MMR','HIV'], source:'slide',
 stem:'A patient with HIV has a CD4 count of 150 cells/mm³ and no evidence of immunity to measles. What applies to MMR?',
 options:[
  {t:'MMR is contraindicated', correct:true, why:'AAFP Notes: contraindicated for HIV with CD4 percentage below 15% or count below 200 cells/mm³.'},
  {t:'Give 2 doses 4 weeks apart', correct:false, why:'This applies at CD4 15% or above and 200 or above for at least 6 months (AAFP Notes).'},
  {t:'Give 1 dose after delivery', correct:false, why:'This is the rule for pregnancy without rubella immunity (AAFP Notes).'},
  {t:'Give it only if born before 1957', correct:false, why:'Birth before 1957 is evidence of immunity, not a path for this patient (AAFP Notes).'}],
 teach:'Severe immunodeficiency makes both MMR and varicella vaccine contraindicated.',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (MMR); Appendix'},

{id:'i27', skill:'tell', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'mmr-immunity',
 tags:['MMR'], source:'slide',
 stem:'Which is evidence of immunity to measles, mumps and rubella?',
 options:[
  {t:'Laboratory evidence of immunity or disease', correct:true, why:'AAFP Notes list laboratory evidence, documentation of MMR vaccine, or birth before 1957 (except health care personnel).'},
  {t:'A clinical diagnosis of measles without a lab test', correct:false, why:'Diagnosis of disease without laboratory confirmation is not evidence of immunity (AAFP Notes).'},
  {t:'A patient’s memory of childhood vaccines', correct:false, why:'Documentation of receipt is required, not recall (AAFP Notes).'},
  {t:'Being born after 1957', correct:false, why:'AAFP Notes: birth before 1957 is evidence of immunity, so birth after 1957 is not.'}],
 teach:'Health care personnel born before 1957 without evidence of immunity should still be considered for a 2-dose series.',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (MMR)'},

{id:'i28', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'flu-65',
 tags:['influenza'], source:'slide',
 stem:'Which influenza vaccines are preferred for a patient aged 65 or older?',
 options:[
  {t:'HD-IIV3, RIV3 or aIIV3', correct:true, why:'AAFP Notes: at age 65 or older, any one of HD-IIV3, RIV3 or aIIV3 (high-dose, recombinant or adjuvanted) is preferred.'},
  {t:'Live attenuated (LAIV3)', correct:false, why:'FluMist is not the preferred product at 65 or older (AAFP Notes).'},
  {t:'Only egg-based IIV3', correct:false, why:'The Notes name HD-IIV3, RIV3 or aIIV3 as preferred at 65 or older, not standard IIV3 alone (AAFP Notes).'},
  {t:'Any influenza vaccine with no preference', correct:false, why:'AAFP Notes name HD-IIV3, RIV3 and aIIV3 as the preferred products at 65 or older, so there is a preference.'}],
 teach:'Persons with an egg allergy can receive any influenza vaccine appropriate for age and health status.',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (influenza)'},

{id:'i29', skill:'tell', prof:'Dr. Parsons', multi:true, tier:'new', topic:'imm', sub:'contra', concept:'laiv-contra',
 tags:['influenza','contraindications'], source:'slide',
 stem:'Which are contraindications to live attenuated influenza vaccine (LAIV3, FluMist)? Select all that apply.',
 options:[
  {t:'Anatomic or functional asplenia', correct:true, why:'AAFP Appendix lists anatomic or functional asplenia as a contraindication to LAIV3.'},
  {t:'Pregnancy', correct:true, why:'AAFP Appendix lists pregnancy as a contraindication to LAIV3.'},
  {t:'Immunocompromised due to any cause', correct:true, why:'AAFP Appendix lists immunocompromise due to any cause as a contraindication to LAIV3.'},
  {t:'Cochlear implant', correct:true, why:'AAFP Appendix lists cochlear implant as a contraindication to LAIV3.'},
  {t:'An egg allergy', correct:false, why:'Egg allergy does not prevent any influenza vaccine (AAFP Notes; the Appendix excludes egg from the component allergy).'},
  {t:'Age 25 years', correct:false, why:'Age 19–49 is covered by the schedule; age is not a contraindication (AAFP Table 2).'}],
 teach:'Close contacts or caregivers of severely immunosuppressed persons who require a protected environment should not receive LAIV3, or should avoid contact for 7 days.',
 cite:'AAFP-Adult-Schedule-2026.pdf Appendix and Notes'},

{id:'i30', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'hib-asplenia',
 tags:['Hib','asplenia'], source:'both',
 stem:'A patient is having an elective splenectomy. When is Hib vaccine best given?',
 options:[
  {t:'1 dose at least 14 days before surgery', correct:true, why:'AAFP Notes: elective splenectomy, 1 dose preferably at least 14 days before splenectomy.'},
  {t:'1 dose on the day of surgery', correct:false, why:'AAFP Notes: for an elective splenectomy give Hib at least 14 days beforehand, not on the day of surgery.'},
  {t:'3 doses starting 6 months after surgery', correct:false, why:'AAFP Notes: 3 doses starting 6–12 months after transplant is the HSCT series, not the splenectomy plan.'},
  {t:'None; Hib is only for children', correct:false, why:'AAFP Notes list Hib for adults with asplenia, so Hib is not only for children.'}],
 teach:'Asplenia (including sickle cell disease): 1 dose if not previously vaccinated. HSCT recipients: 3 doses 4 weeks apart starting 6–12 months after successful transplant. (T) A trauma patient with an urgent splenectomy needs many vaccines.',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (Hib); 9/21 transcript (T)'},

{id:'i31', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'menacwy-risk',
 tags:['meningococcal'], source:'slide',
 stem:'A patient with asplenia or HIV needs MenACWY. What is the regimen?',
 options:[
  {t:'2 doses at least 8 weeks apart', correct:true, why:'AAFP Notes: asplenia or HIV gets 2 doses of Menveo or MenQuadfi at least 8 weeks apart, revaccinated every 5 years if risk remains.'},
  {t:'1 dose of Menveo or MenQuadfi only', correct:false, why:'That is for first-year college students in residential housing or military recruits (AAFP Notes).'},
  {t:'3 doses of Bexsero (MenB-4C)', correct:false, why:'AAFP vaccine list: Bexsero is a MenB vaccine, and the stem asks for the MenACWY regimen; asplenia has a separate MenB series in the Notes.'},
  {t:'1 dose of MenACWY every 10 years', correct:false, why:'AAFP Notes: revaccination is every 5 years if risk remains, not every 10 years.'}],
 teach:'MenACWY products are Menveo (MenACWY-CRM) and MenQuadfi (MenACWY-TT).',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (meningococcal)'},

{id:'i32', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'dose-interval',
 tags:['dose intervals'], source:'slide',
 stem:'A second dose was given 6 days before the minimum interval. What is correct?',
 options:[
  {t:'The dose is not valid and is repeated', correct:true, why:'AAFP Notes: doses given 5 or more days early are not counted and are repeated.'},
  {t:'The dose is valid', correct:false, why:'Only doses given 4 days or fewer before the minimum interval are valid (AAFP Notes).'},
  {t:'The series restarts from dose 1', correct:false, why:'The schedule’s vaccine-list footnote says not to restart series for extended intervals; an invalid early dose is repeated, spaced after the invalid dose (Notes).'},
  {t:'The dose is valid if the patient asks', correct:false, why:'Validity depends on the interval, not a request (AAFP Notes).'}],
 teach:'4 weeks equals 28 days. A dose given up to 4 days before the minimum age or interval is valid; 5 or more days early is repeated.',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (additional information)'},

{id:'i33', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'vax', concept:'mpox',
 tags:['mpox'], source:'slide',
 stem:'What is the mpox vaccine (Jynneos) regimen for an adult at risk?',
 options:[
  {t:'2 doses, 28 days apart', correct:true, why:'AAFP Notes: a person at risk for mpox gets a 2-dose series of Jynneos, 28 days apart.'},
  {t:'1 dose', correct:false, why:'AAFP Notes: the Jynneos series is 2 doses, so 1 dose is incomplete.'},
  {t:'3 doses at 0, 1 and 6 months', correct:false, why:'AAFP Notes: 0, 1 and 6 months is the hepatitis B pattern, not the mpox series.'},
  {t:'2 doses, 6 months apart', correct:false, why:'AAFP Notes: the 2 Jynneos doses are given 28 days apart, not 6 months apart.'}],
 teach:'Risk includes some persons who are gay, bisexual or other men who have sex with men, with certain recent exposures, and persons deemed at risk by public health authorities.',
 cite:'AAFP-Adult-Schedule-2026.pdf Notes (mpox)'},

/* ---- SBAR and talking with patients ----------------------------------- */
{id:'i34', skill:'recall', type:'match', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sbar', concept:'sbar-sort',
 tags:['SBAR'], source:'slide',
 stem:'Match each statement from the example SBAR to its component.',
 left:'Statement', right:'Component',
 pairs:[
  {l:'Mrs. Jones is at the pharmacy to be assessed for vaccine needs', r:'Situation', why:'Slide 22, S.'},
  {l:'She is a 61-year-old healthcare worker with type 2 diabetes complicated by chronic kidney disease', r:'Background', why:'Slide 22, B.'},
  {l:'AAFP recommends PCV21 for patients aged 19–64 with diabetes', r:'Assessment', why:'Slide 22, A.'},
  {l:'I recommend PCV21, Shingrix, influenza, RSV and an updated COVID-19 vaccine', r:'Recommendation', why:'Slide 22, R.'}],
 teach:'(T) If you have trouble formulating an SBAR, think in reverse: start from the recommendation, then ask what assessment led to it and what background supports it. The situation should be simple. Be complete but concise.',
 cite:'Immunizations-Pre-Lab.pdf slides 20–22; 9/21 transcript (T)'},

{id:'i35', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sbar', concept:'sbar-source',
 tags:['SBAR'], source:'both',
 stem:'In a vaccine SBAR to a preceptor, what should the assessment state beyond the vaccines indicated?',
 options:[
  {t:'The source, such as AAFP or CDC', correct:true, why:'(T) Cite your source, especially early in your career; the example reads “AAFP recommends…” (slide 22).'},
  {t:'The patient’s insurance plan', correct:false, why:'Slide 22’s example assessment cites AAFP and the vaccines indicated; it does not mention insurance.'},
  {t:'The pharmacy’s vaccine stock', correct:false, why:'Slide 22’s example assessment cites AAFP and the vaccines indicated; it does not mention pharmacy stock.'},
  {t:'Nothing; the recommendation is enough', correct:false, why:'(T) Dr. Parsons said to cite your source in the assessment, so the recommendation alone is not enough.'}],
 teach:'(T) Cite your source, especially early in your career; in practice she adds the source when guidance is new and other providers may not have caught up.',
 cite:'Immunizations-Pre-Lab.pdf slide 22; 9/21 transcript (T)'},

{id:'i36', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sbar', concept:'patient-language',
 tags:['communication'], source:'both',
 stem:'How should the pharmacist explain a vaccine recommendation to the patient?',
 options:[
  {t:'Simple language, why it is needed, next dose', correct:true, why:'Slides 22–23 and (T): use the simplest language, say why the patient specifically needs it, and mention the next dose (for example 2–6 months).'},
  {t:'In medical terms, to show your expertise', correct:false, why:'(T) Dr. Parsons said basic language is appreciated by nearly all patients, so medical terms are not the goal.'},
  {t:'With only the name of the vaccine and where to get it', correct:false, why:'(T) The patient should hear why they specifically need the vaccine, not just its name.'},
  {t:'Without mentioning that a second dose is needed', correct:false, why:'Slide 23: tell the patient that a second shot is needed in 2–6 months.'}],
 teach:'(T) For example, as we get older our immunity naturally declines, and with diabetes the immune system is less strong.',
 cite:'Immunizations-Pre-Lab.pdf slide 23; 9/21 transcript (T)'},

{id:'i37', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'sbar', concept:'travel-resources',
 tags:['travel'], source:'both',
 stem:'Which resource tells which vaccines are indicated for a trip, by destination?',
 options:[
  {t:'CDC travel site and Yellow Book', correct:true, why:'Slides 6 and 26; (T) the recommendations can differ by area within a country.'},
  {t:'The AAFP adult schedule', correct:false, why:'The adult schedule covers routine adult vaccines; travel information is in the CDC resources (slides 6, 26).'},
  {t:'Immunize.org screening checklists', correct:false, why:'Immunize.org provides information sheets and screening checklists (slide 6).'},
  {t:'The pharmacy’s travel clinic list', correct:false, why:'Travel clinics provide vaccines; they are not the source of recommendations (slide 25).'}],
 teach:'(T) Community pharmacists can give travel vaccines but generally are not prescribers for travel medications such as antimalarials.',
 cite:'Immunizations-Pre-Lab.pdf slides 6, 24–26; 9/21 transcript (T)'},

/* ---- vaccine hesitancy ------------------------------------------------ */
{id:'i38', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'hes', concept:'hesitancy-definition',
 tags:['vaccine hesitancy'], source:'both',
 stem:'What is vaccine hesitancy?',
 options:[
  {t:'Reluctance or refusal when vaccines are available', correct:true, why:'Slide 27 defines vaccine hesitancy as the reluctance or refusal to vaccinate despite the availability of vaccines.'},
  {t:'A shortage of vaccine supply in a community', correct:false, why:'Slide 27 defines hesitancy as refusal despite vaccines being available, so a shortage is not hesitancy.'},
  {t:'A delay in getting the vaccine caused by insurance approval', correct:false, why:'Slide 27’s definition is reluctance or refusal despite availability; an insurance delay is not part of it.'},
  {t:'A contraindication to a vaccine', correct:false, why:'A contraindication is a medical reason not to give (Appendix); hesitancy is reluctance.'}],
 teach:'Healthcare professionals may be vaccine hesitant. Of all barriers to vaccination, hesitancy is considered one of the most critical, and the WHO named it among the ten leading threats to global health in 2019 (slides 27–28). (T) It is likely to be on assessments.',
 cite:'Immunizations-Pre-Lab.pdf slides 27–28; 9/21 transcript (T)'},

{id:'i39', skill:'recall', type:'match', prof:'Dr. Parsons', tier:'new', topic:'imm', sub:'hes', concept:'ask-tell-ask',
 tags:['Ask-Tell-Ask'], source:'slide',
 stem:'Match each statement to its step in the Ask-Tell-Ask method.',
 left:'Statement', right:'Step',
 pairs:[
  {l:'It sounds like you don’t want the shot today. Can you help me understand why not?', r:'Ask: learn the reason', why:'Slide 32, first Ask: explore why the patient is declining.'},

/* Optional topics: a TOPICS entry with `optional: true` holds questions kept in the
   bank but outside the active exam (Louis, 2026-11-06, for slides a professor left
   off the assigned pages: kept "outside Exam 1 practice papers, required-exam
   readiness calculations, and default Exam 1 study recommendations", reachable
   "through an explicitly labeled optional or beyond-Exam-1 practice category").
   The mark is per topic, not per question. Those questions are left out of every
   default set (Everything, adaptive, filtered or not; the passes; the exam pools,
   so papers, the exam-weighted pass, the readiness cards and mark weights; What to
   review next and the mastered count) and carry no exam label; opening the topic,
   one of its subtopics or a drill of its own reaches them. A course with no
   optional topic is unchanged: requiredQs() is then every question. */
const OPTIONAL_TOPICS = new Set(TOPICS.filter(t => t && t.optional).map(t => t.id));
const isOptional = q => !!q && OPTIONAL_TOPICS.has(q.topic);
// read from QUESTIONS at each call, so a check that replaces the bank in place is followed
const requiredQs = () => OPTIONAL_TOPICS.size ? QUESTIONS.filter(q => !isOptional(q)) : QUESTIONS;
/* Which exam the simulator and the weighted pass follow, and its pools. A pool
   filter is an object of field:value; an array value means "one of". */
const EXAM = COURSE.exams.find(e => e.id === COURSE.activeExam) || COURSE.exams[0];
/* Fields a pool filter may name: any question field, plus exam, module and
   lecture, which come from the lecture the question's citation names. */
const fieldOf = (q, k) => (k === 'exam' || k === 'module') ? (lecOf(q) || {})[k] : k === 'lecture' ? (lecOf(q) || {}).id : q[k];
const poolFilter = f => q => Object.entries(f).every(([k, v]) => Array.isArray(v) ? v.includes(fieldOf(q, k)) : fieldOf(q, k) === v);
EXAM.pools.forEach(p => { const t = poolFilter(p.filter); p.test = q => !isOptional(q) && t(q); });
const poolOf = q => EXAM.pools.find(p => p.test(q));
/* The lecture a question comes from, read from the deck its citation names. */
const lecOf = q => {
  if(q._lec !== undefined) return q._lec;
  const c = q.cite || '';
  return (q._lec = COURSE.lectures.find(l => c.includes(l.deck)) || null);
};
const examLabel = q => { const l = lecOf(q); if(!l || isOptional(q)) return '';
  return `Exam ${l.exam} · ${l.module}`; };

/* ==========================================================================
   STORAGE — namespaced per profile so several people can share one browser
   ========================================================================== */
/* A preview (build.py --preview, served at /preview/ on the same origin as the
   live drill) keeps everything under its own namespace, so opening a preview and
   answering questions in it never changes the live drill's saved progress. */
const NS = COURSE.ns + (BUILD.preview ? '-preview' : '');

/* localStorage is not always reachable. Opening this file from disk can give
   the page an opaque origin, and a private window or blocked site data does the
   same, in which case even reading localStorage throws a SecurityError. That
   throw used to happen while the script was still evaluating, which killed the
   whole app and left a blank page. Everything goes through `store`, so the drill
   still runs when storage is unavailable.

   A write can also fail later in a visit that started with working storage:
   the origin's quota is full (every drill on lglouis3-create.github.io shares
   one origin, and so one quota). The template's shim probed once at load, so a
   later failed write was kept in memory but every read still went to
   localStorage and returned the old value. `store` (Intro-Pharmacology,
   exam1-drill/src/app.js) tracks each key whose last write failed and serves it
   from memory until a write succeeds, so nothing is lost within the visit, and
   the first failure shows one notice that points to Export progress. */
const MEM = {}, FAILED = new Set();   // FAILED: keys whose last write the browser refused; their value lives in MEM
const KEPT = {};   // per key, what this page last read from storage or had the browser keep there (load)
let SAVE_WARNED = false;   // the "did not save" notice was shown since FAILED was last empty (saveWarn)
// a key the browser kept: no longer refused; once no key is, a later refusal shows the notice again
const keptNow = k => { FAILED.delete(k); if(!FAILED.size) SAVE_WARNED = false; };
const store = {
  get(k){
    if(FAILED.has(k)) return MEM[k] === undefined ? null : MEM[k];
    try { const v = localStorage.getItem(k); return v === null ? (MEM[k] === undefined ? null : MEM[k]) : v; }
    catch(e){ return MEM[k] === undefined ? null : MEM[k]; }
  },
  // true when the browser kept it; false when storage is full or blocked (it is then kept for this visit only)
  // SEEN (seenAs) follows only a write the browser kept: a refused write leaves it at what is
  // stored, so a later save by another tab still shows as one
  set(k, v){
    MEM[k] = v;
    try { localStorage.setItem(k, v); keptNow(k); KEPT[k] = v; seenAs(k, v); pendingAfter(k, v); return true; }
    catch(e){ FAILED.add(k); saveWarn(k); return false; }
  },
  del(k){ delete MEM[k]; keptNow(k); KEPT[k] = null; seenAs(k, null); try { localStorage.removeItem(k); } catch(e){ /* nothing to remove */ } pendingAfter(k, null); },
  // Import's writes: true when the browser kept it; false when it refused, and then
  // nothing changes, not even the copy kept for this visit, so a refused import
  // leaves the progress on screen and in storage exactly as it was
  trySet(k, v){
    try { localStorage.setItem(k, v); MEM[k] = v; keptNow(k); KEPT[k] = v; seenAs(k, v); pendingAfter(k, v); return true; }
    catch(e){ return false; }
  },
};
/* What this page last read under the profile's own progress and history keys, or wrote
   there with the browser keeping it (SEEN, SEEN_LOG, below); kept by every write through
   `store` that succeeds (saveLog writes through `store` too). A refused write does not change it. A save
   finds another value stored when another tab or window of this site saved the profile
   since; it then writes nothing (staleWarn). Called before the profile is known, it does
   nothing. */
function seenAs(k, v){
  try {
    if(!PROFILE) return;
    if(k === keyFor(PROFILE)) SEEN = v;
    else if(k === logKey()) SEEN_LOG = v;
  } catch(e){ /* during start-up, before these are defined */ }
}
/* The first time a preview opens in a browser, it copies the live drill's saved
   keys into its own namespace, so the preview shows the student's real progress.
   It only reads the live keys; it never writes or removes one. */
if(BUILD.preview){
  try {
    const live = COURSE.ns + ':', mine = NS + ':', keys = [];
    let copied = false;
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k.startsWith(mine)) copied = true;
      else if(k.startsWith(live)) keys.push(k);
    }
    if(!copied) keys.forEach(k => store.set(mine + k.slice(live.length), localStorage.getItem(k)));
  } catch(e){ /* storage unreadable: the preview starts empty */ }
}
/* Progress that cannot be saved would be lost on reload without a word: say so
   once while writes are refused, and point to the export. A refused write after every
   refused key was written again shows it again (SAVE_WARNED, keptNow). When a history
   key (`<ns>:log:`) is refused, the notice names the answer history too. */
let SAVE_WARN_LOG = false;
let REC_OFF = false;   // storage full: this tab has no per-tab record (#45) of its last save (pendingAfter, dropOwnRecordIfStored)
const REC_OFF_TEXT = 'While storage is full, this tab cannot keep the record that protects its last save when it closes without handing over to another open tab of this drill.';
const hereRefused = () => { try { return FAILED.has(keyFor(PROFILE)) || FAILED.has(logKey()); } catch(e){ return FAILED.size > 0; } };
const saveWarnText = () => (hereRefused() ? 'This browser did not save your progress' + (SAVE_WARN_LOG ? ' or answer history' : '') +
  ' (storage is full or blocked). It is kept on this page until you close or reload it; closing or reloading it loses it. Export it to a file to keep it; Import progress adds it back.' +
  (REC_OFF ? ' ' + REC_OFF_TEXT : '')
  : awayRefused().length ? 'This browser did not save some of the progress or answer history of another profile on this page (storage is full or blocked). It is kept on this page until you close or reload it; closing or reloading it loses it. Export it to keep it; Import progress adds it back.'
  : REC_OFF ? 'Storage is full. Your progress is saved, but this tab cannot keep the record that protects its last save when it closes without handing over to another open tab of this drill. Export progress keeps a copy in a file.'
