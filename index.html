<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5FA8">
<!-- Installable from the hosted site. build.py writes the manifest and icons
     beside the page; opened from disk the drill is self-contained either way. -->
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Exam drill</title>
<style>
:root{
  --ink:#16202E; --ink-2:#22303F; --paper:#FFFFFF; --surface:#F2F4F7;
  --line:#D3DAE3; --line-soft:#E7ECF1;
  --text:#16202E; --text-dim:#5A6878;
  --ok:#1B7F4B; --ok-bg:#E8F5ED; --bad:#B3261E; --bad-bg:#FCEBEA;
  --warn:#B26B00; --warn-bg:#FDF3E2; --accent:#2F5FA8; --accent-bg:#EAF0F9;
  --sik:#2F5FA8; --yen:#7A3E9D;
  /* heteroatom palette + highlight wash, used by the functional group atlas */
  --at-o:#C2402F; --at-n:#2B62B5; --at-s:#96700C; --at-p:#7A46B0; --at-x:#2C7A50;
  --wash:rgba(190,58,43,0.13);
  --r:10px; --maxw:860px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
.prose{font-family:Georgia,"Iowan Old Style","Source Serif 4",serif; line-height:1.62}
.gloss{color:var(--text-dim);font-size:.9em;font-style:italic}
.teach h5.tsec{margin:16px 0 4px;font-size:12.5px;font-weight:700;letter-spacing:.055em;
  text-transform:uppercase;color:var(--accent,#2E5C8A)}
.teach h5.tsec:first-of-type{margin-top:10px}
.teach .prose+h5.tsec{border-top:1px solid rgba(0,0,0,.07);padding-top:14px}
.teach .prose{margin:0 0 2px}
.prose .gloss{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.86em}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- chrome ---------- */
header{
  background:var(--ink); color:#fff; padding:10px 16px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  position:sticky; top:0; z-index:40;
}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
header .who{font-size:12px;color:#9FB0C4;margin-left:auto;display:flex;gap:8px;align-items:center}
header .who button{background:#2A3A4D;color:#DCE6F2;border:1px solid #3B4F66;border-radius:6px;padding:3px 9px;font-size:12px}
nav{background:var(--ink-2);display:flex;gap:2px;padding:0 8px;overflow-x:auto;position:sticky;top:var(--head-h,44px);z-index:39}
nav button{
  background:none;border:0;color:#9FB0C4;padding:10px 14px;font-size:14px;
  border-bottom:3px solid transparent;white-space:nowrap
}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:#6FA0E8}
/* More tabs off the edge (views.js navCue): a chevron on a fade, on the side that
   has more; the bar scrolls under it. Each takes no width of its own. */
nav::before,nav::after{position:sticky;z-index:1;flex:0 0 30px;display:none;align-items:center;
  font-size:22px;line-height:1;color:#fff;cursor:pointer;pointer-events:auto}
nav::before{content:"\2039";left:-8px;margin-right:-30px;margin-left:-8px;padding-left:8px;justify-content:flex-start;
  background:linear-gradient(to right,var(--ink-2) 55%,transparent)}
nav::after{content:"\203A";right:-8px;margin-left:-30px;margin-right:-8px;padding-right:8px;justify-content:flex-end;
  background:linear-gradient(to left,var(--ink-2) 55%,transparent)}
nav.more-l::before,nav.more-r::after{display:flex}
main{max-width:var(--maxw);margin:0 auto;padding:18px 14px 90px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:16px;margin:22px 0 8px}
.sub{color:var(--text-dim);font-size:14px;margin:0 0 18px}
.hide{display:none !important}

/* ---------- topic list ---------- */
.topic{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden
}
.topic>summary{
  padding:13px 15px;display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none
}
.topic>summary::-webkit-details-marker{display:none}
.topic>summary::before{content:"▸";color:var(--text-dim);font-size:13px;transition:transform .15s}
.topic[open]>summary::before{transform:rotate(90deg)}
.topic .tname{font-weight:600;flex:1;min-width:0}
.topic .tname small{display:block;font-weight:400;color:var(--text-dim);font-size:12.5px;margin-top:2px}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid;white-space:nowrap}
.tag.sik{color:var(--sik);border-color:#BDD0EA;background:#F1F6FD}
.tag.yen{color:var(--yen);border-color:#DCC7EA;background:#F8F2FB}
.tag.p3{background:#eef6ee;color:#2f6b3a;border-color:#bfe0c4}
.tag.p4{background:#f6eef6;color:#6b2f66;border-color:#dfbfdc}
.subs{border-top:1px solid var(--line-soft);padding:6px 8px 10px}
.subrow{
  display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px
}
.subrow:hover{background:var(--surface)}
.subrow .sname{flex:1;min-width:0;font-size:14.5px}
.subrow .sname small{display:block;color:var(--text-dim);font-size:12px}
.subrow button{
  background:var(--accent);color:#fff;border:0;border-radius:7px;padding:7px 13px;font-size:13px;font-weight:500
}
.subrow button.done{background:var(--ok)}
.meter{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;width:64px;flex:none}
.meter i{display:block;height:100%;background:var(--ok)}
.counts{font-size:11.5px;color:var(--text-dim);white-space:nowrap;min-width:52px;text-align:right}

/* ---------- filter bar ---------- */
.filters{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.filters .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters .frow:last-child{margin-bottom:0}
.filters label{font-size:12.5px;color:var(--text-dim);margin-right:2px}
.chip{
  border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--text)
}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.none{border-style:dashed;color:var(--text-dim)}
.chip.none small{font-size:11px}

/* ---------- quiz ---------- */
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qhead{
  padding:9px 14px;border-bottom:1px solid var(--line-soft);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-dim)
}
.qhead .spacer{flex:1}
.qbody{padding:16px}
.tdimg{margin:2px 0 10px;background:#fff;border:1px solid var(--line-soft);border-radius:6px}
.qprog{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line-soft);
  font-size:12px;color:var(--text-dim);background:var(--surface)}
.qprog .pbar{flex:1;height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;min-width:60px}
.qprog .pbar i{display:block;height:100%;background:var(--ok)}
.stem{font-size:17px;line-height:1.5;margin:0 0 14px}
.qimg{width:100%;background:#fff;border:1px solid var(--line-soft);border-radius:8px;margin:0 0 14px;display:block}
.opt{
  display:flex;gap:11px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-bottom:9px;
  font-size:15px;line-height:1.45;color:var(--text)
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
.opt .k{
  flex:none;width:23px;height:23px;border-radius:5px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--text-dim)
}
.opt.pick-ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.pick-ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.pick-bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.pick-bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.reveal-ok{border-color:var(--ok)}
.opt.reveal-ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
/* an exam answer chosen and not yet graded: the selection colour, never right or wrong */
.opt.exsel{border-color:var(--accent);background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.exsel .k{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- select-all questions ---------- */
.sata{margin:0 0 10px;font-size:13px;color:var(--text-dim);padding:7px 11px;background:var(--surface);
  border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.opt.multi .k{font-size:17px;line-height:1;background:transparent;border-color:var(--line)}
.opt.multi.on{border-color:var(--accent);background:var(--accent-bg)}
.opt.multi.on .k{color:var(--accent);border-color:var(--accent)}
.opt.multi.pick-ok .k,.opt.multi.reveal-ok .k{background:var(--ok);color:#fff}
.opt.multi.pick-bad .k{background:var(--bad);color:#fff}
.tag.sata{color:#7A46B0;border-color:#DCC7EA;background:#F8F2FB}
.youpicked{font-style:normal;font-size:11.5px;color:var(--text-dim);margin-left:4px}

/* ---------- weak spots: what to do next ---------- */
.nextgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px;margin:0 0 22px}
.nextcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.nexthead{display:flex;flex-direction:column;gap:2px;margin-bottom:9px}
.nexthead b{font-size:14.5px}
.nexthead span{font-size:12px;color:var(--text-dim)}
.nextrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;
  border-top:1px dashed var(--line-soft);font-size:13.5px}
.nextrow i{font-style:normal;color:var(--text-dim);font-size:12.5px}
.btn.small{padding:6px 11px;font-size:13px}
.opt:disabled{cursor:default;opacity:1}

.why{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:14px}
.why .verdict{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;gap:8px;align-items:center}
.why .verdict.ok{color:var(--ok)} .why .verdict.bad{color:var(--bad)}
.wrow{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--line-soft)}
.wrow:first-of-type{border-top:0}
.wrow .mark{flex:none;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.wrow .mark.y{background:var(--ok)} .wrow .mark.n{background:var(--bad)}
.wrow .wtxt{font-size:14.5px;line-height:1.55}
.wrow .wtxt b{font-weight:600}
.teach{margin-top:14px;background:var(--accent-bg);border:1px solid #CFDDF0;border-radius:9px;padding:13px 15px}
.teach h4{margin:0 0 7px;font-size:13px;color:var(--accent);font-weight:600}
.teach p{margin:0;font-size:15px;line-height:1.62}
.tdiag{background:#fff;border:1px solid #CFDDF0;border-radius:7px;padding:10px;margin:0 0 11px;overflow-x:auto}
.tdiag svg{display:block;max-width:100%;height:auto;margin:0 auto}
.quote{display:block;font-style:italic;color:var(--text);margin-bottom:6px;font-size:13px}
.cite{
  margin-top:13px;font-size:12.5px;color:var(--text-dim);background:var(--surface);
  border-left:3px solid var(--line);padding:9px 11px;border-radius:0 7px 7px 0
}
.cite .srcflag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:6px;
  background:var(--warn-bg);color:var(--warn);border:1px solid #E8CFA2}
.qfoot{padding:12px 14px;border-top:1px solid var(--line-soft);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 17px;font-size:15px;font-weight:500}
.btn.ghost{background:var(--paper);color:var(--text);border:1px solid var(--line)}
.btn.amber{background:var(--warn-bg);color:var(--warn);border:1px solid #E8CFA2}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- dashboard ---------- */
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat div{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;flex:1;min-width:110px}
.stat b{display:block;font-size:25px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--text-dim)}
table.gap{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
table.gap th,table.gap td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-soft)}
.gapwrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 4px}
table.gap th{background:var(--surface);font-size:12.5px;color:var(--text-dim);font-weight:600}
table.gap tr:last-child td{border-bottom:0}
.bar{height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%}
.missq{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;margin-bottom:9px}
.missq .mstem{font-size:14.5px;margin-bottom:6px}
.missq .mmeta{font-size:12px;color:var(--text-dim)}

/* ---------- exam ---------- */
.examhead{background:var(--ink);color:#fff;border-radius:var(--r);padding:13px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.examhead .clock{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}
.examhead .clock.low{color:#FF9A8F}
.examhead .prog{font-size:13px;color:#9FB0C4;margin-left:auto}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:12px 0}
.exq{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:8px;
  border:1px solid var(--accent);background:var(--accent-bg);color:var(--text)}
.exq b{font-size:16px}
.exq small{font-size:11px;color:var(--text-dim)}
.exq.blank{border:1px dashed var(--line);background:var(--paper)}
.exq:hover,.exq:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- the bar along the bottom: a newer version, saved for offline use ---------- */
#swbar{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;
  display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 24px);
  background:var(--ink);color:#fff;border-radius:var(--r);padding:8px 8px 8px 14px;
  font-size:14px;line-height:1.35;box-shadow:0 6px 24px rgba(22,32,46,.28)}
#swbar button{background:var(--accent);color:#fff;border:0;border-radius:6px;
  padding:6px 12px;font-size:14px;font-weight:600;flex:none;cursor:pointer}
#swbar .swx{background:none;color:#9FB0C4;font-size:20px;line-height:1;padding:2px 6px;font-weight:400}
body.swbar-on{padding-bottom:76px}

/* ---------- the Home Screen card: a section in Settings that starts closed ---------- */
.hs-card{border-left:4px solid var(--accent)}
.hs-card>summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;list-style:none;font-weight:600}
.hs-card>summary::-webkit-details-marker{display:none}
.hs-card>summary::before{content:"\25B8";color:var(--text-dim);font-size:13px}
.hs-card[open]>summary::before{content:"\25BE"}
.hs-steps{margin:4px 0 10px;padding-left:1.3em;font-size:13.5px;color:var(--text-dim)}
.hs-steps li{margin:4px 0}

/* ---------- the notices shown once when the browser refuses to save, and when
   the saved progress could not be loaded ---------- */
#savewarn,#loadwarn,.awaywarn,#pendingnote{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;
  max-width:720px;margin:0 auto;background:var(--warn-bg);color:var(--text);border:1px solid var(--warn);
  border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.45;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#savewarn .btn,#loadwarn .btn,.awaywarn .btn,#pendingnote .btn{margin-left:8px;padding:4px 10px;font-size:13px}
/* a page that has stopped saving (another tab has the profile, or saved it since): the
   page takes no answers until it can save again, so nothing is studied unsaved */
#stopwall,#stalewarn{position:fixed;inset:0;z-index:60;background:rgba(10,16,24,.62);display:flex;align-items:center;
  justify-content:center;padding:16px;overflow:auto}
#stopwall .stopcard,#stalewarn .stopcard{max-width:560px;width:100%;background:var(--paper);color:var(--text);border:1px solid var(--warn);
  border-radius:8px;padding:16px;font-size:14.5px;line-height:1.5;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#stopwall .stopcard p,#stalewarn .stopcard p{margin:0 0 10px}
#stopwall .stoprow,#stalewarn .stoprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- misc ---------- */
.note{background:var(--warn-bg);border:1px solid #E8CFA2;color:#6B4200;border-radius:var(--r);padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.note b{color:#6B4200}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--text-dim)}
.reftab{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);font-size:13.5px;margin-bottom:20px}
.reftab th,.reftab td{border:1px solid var(--line-soft);padding:8px 10px;text-align:left;vertical-align:top}
.reftab th{background:var(--surface);font-size:12.5px;font-weight:600}
.sweepcard{border-color:var(--accent);background:var(--accent-bg)}
.sweepcard .subs{border-top:0}
.sweepcard .subrow:hover{background:rgba(255,255,255,.5)}
.fgshow{background:#fff;border:1px solid var(--line-soft);border-radius:8px;
  padding:18px 12px;margin:0 0 15px;display:grid;place-items:center;min-height:120px}
.fgshow svg{max-width:100%;height:auto;color:var(--text)}

/* ---------- structures compared side by side ---------- */
.cmp{margin:0 0 14px}
.cmp h5{margin:0 0 9px;font-size:11.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--accent)}
.cmprow{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px}
.cmpcell{margin:0;background:#fff;border:1px solid #CFDDF0;border-radius:7px;
  padding:9px 8px;display:flex;flex-direction:column;gap:6px}
.cmpfig{display:grid;place-items:center;min-height:86px}
.cmpfig svg{max-width:100%;height:auto;color:var(--text)}
.cmpcell figcaption{font-size:12.5px;line-height:1.35;color:var(--text)}
.cmpcell figcaption b{display:block;font-weight:600}
.cmpcell figcaption span{display:block;margin-top:3px;font-size:11.5px;
  line-height:1.4;color:var(--text-dim)}
.cmpcell figcaption .alt{font-weight:400;color:var(--text-dim)}
.cmpcell.is-ok{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.cmpcell figcaption i{display:block;font-style:normal;font-weight:600;font-size:10.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ok);margin-top:2px}

/* one option's structure, beside its explanation */
.wrow{align-items:flex-start}
.wfig{flex:0 0 auto;margin-left:10px;padding:5px 6px;background:#fff;
  border:1px solid var(--line-soft);border-radius:6px;display:grid;place-items:center;
  min-width:64px}
.wfig svg{max-width:100%;height:auto;color:var(--text)}
@media (max-width:620px){
  .wrow{flex-wrap:wrap}
  .wfig{margin:7px 0 0 26px}
}
.teach .fgshow{background:#fff;border-color:#CFDDF0;margin-bottom:11px}

/* ---------- functional group atlas ---------- */
.atbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:16px;
  position:sticky;top:calc(var(--head-h,44px) + var(--nav-h,44px));z-index:30}
.atbar input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;
  padding:6px 10px;width:190px;background:var(--paper);color:var(--text)}
.atbar .spacer{flex:1}
.atboard{margin-bottom:30px;scroll-margin-top:150px}
.atboard h3{border-top:2px solid var(--ink);padding-top:12px;margin:0 0 4px}
.atboard .bintro{font-size:13.5px;color:var(--text-dim);margin:0 0 14px;max-width:44rem}
.atsub{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-dim);
  border-bottom:1px solid var(--line-soft);padding-bottom:5px;margin:18px 0 11px}
.atgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:11px}

/* ==========================================================================
   DIAGRAMS — figures drawn as inline SVG
   ==========================================================================
   A figure is a string of SVG markup wrapped in <figure class="fig">. Figures
   are written here rather than cropped from a slide when the point is a process
   or a relation: they stay sharp at any size, cost almost nothing in file size,
   and follow the page's light and dark colours.

   Three ways a figure reaches the reader:
     a question's concept block   `svg: DIA.key` on the question
     a reading tab                `<!--DIA:key-->` in reference.js / tell.js / guide.js
     the Diagrams tab             listed in DIAGRAMS below

   `figure(inner, cap, h)` wraps plain SVG. `stepper(key, title, steps, h, cap,
   footer)` builds a step-through: one group per step, with Back, Next, Replay
   step, Play all and a dot per step. The engine (views.js) animates the move
   between two steps, so authoring a step-through means writing each step's end
   state and nothing about the motion. See STEPPERS.md before writing one; the
   two rules that matter most are repeated here:

     1. A shape that is the same thing in two steps carries the same `data-k`.
        That is what makes it glide instead of fading out and back in.
     2. A shape that should keep its own opacity sets the `opacity` attribute,
        not a CSS class; the fade-in animates from 0 to whatever that is.

   Everything below the helpers is SAMPLE content: one step-through so the
   Diagrams tab, the stepper test and the browser sweep have something to
   exercise. Replace it with the course's own figures.
   ========================================================================== */
const DIA_W = 360;                                  // every figure is drawn 360 wide
const DIA_H = 200;

/* The arrow marker is defined inside each figure, since a figure can be moved
   into a question, a reading tab or the Diagrams tab and has to carry its own. */
const figure = (inner, cap, h = DIA_H) => `<figure class="fig"><svg viewBox="0 0 ${DIA_W} ${h}" role="img" aria-label="${
  String(cap || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().replace(/"/g, '&quot;')}">
  <defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="currentColor" opacity="0.65"/></marker></defs>${inner}</svg>${
  cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;

/* Captions are drawn inside the panel so a step's own words travel with it.
   Three lines at most; the third is clipped rather than overflowing the box. */
const wrapLines = (t, n = 76) => {
  const out = []; let cur = '';
  String(t).split(' ').forEach(w => {
    if ((cur + ' ' + w).trim().length > n) { out.push(cur.trim()); cur = w; } else cur += ' ' + w;
  });
  out.push(cur.trim());
  if (out.length > 3) { out.length = 3; out[2] = out[2].replace(/.{2}$/, '…'); }
  return out.filter(Boolean);
};

/* steps = [[caption, inner, tag?], …]. The caption of the active step is drawn
   in the band at the bottom of the panel, which is why `h` has to leave room
   for it (about 34px for a one-line caption). Captions carry class `capt` so
   the engine fades them rather than trying to glide them. */
function stepper(key, title, steps, h = DIA_H, cap = '', footer = '') {
  let g = title ? `<text class="title" x="${DIA_W / 2}" y="11" text-anchor="middle">${title}</text>` : '';
  steps.forEach((st, i) => {
    const lines = wrapLines(st[0]);
    g += `<g class="st${i === 0 ? ' on' : ''}" data-step="${i + 1}">${st[1]}` +
      `<text class="lbl sm capt" x="6" y="${h - 12 - lines.length * 10}" text-anchor="start">Step ${i + 1} of ${steps.length}${st[2] ? ' · ' + st[2] : ''}</text>` +
      lines.map((l, k) => `<text class="lbl xs capt" x="6" y="${h - 2 - (lines.length - 1 - k) * 10}" text-anchor="start">${l}</text>`).join('') +
      `</g>`;
  });
  const dots = steps.map((st, i) =>
    `<button class="sdot${i === 0 ? ' on' : ''}" data-go="dot" data-i="${i}" aria-label="Go to step ${i + 1}"></button>`).join('');
  const controls = `<div class="anim" data-anim="${key}">` +
    `<button class="btn ghost" data-go="-1">◀ Back</button>` +
    `<button class="btn ghost" data-go="1">Next ▶</button>` +
    `<button class="btn ghost" data-go="replay">↻ Replay step</button>` +
    `<button class="btn ghost" data-go="play">▶ Play all</button>` +
    `<span class="sdots">${dots}</span>` +
    (footer ? `<span class="meta">${footer}</span>` : '') + `</div>`;
  return figure(g, cap, h).replace('</svg>', '</svg>' + controls);
}

/* ---------- SAMPLE: replace with the course's own figures ------------------
   A three-step figure. The ligand circle keeps data-k="lig" in all three
   steps, so it glides along; the signal arrow and the response bar appear only
   in later steps, so they fade in. */
const SAMPLE_STEPS = (() => {
  const box = (x, y, w, hh, k) => `<rect class="box" data-k="${k}" x="${x}" y="${y}" width="${w}" height="${hh}" rx="6"/>`;
  const label = (x, y, t, k) => `<text class="lbl" data-k="${k}" x="${x}" y="${y}" text-anchor="middle">${t}</text>`;
  const frame = `${box(28, 46, 96, 44, 'a')}${label(76, 73, 'SAMPLE A', 'la')}` +
                `${box(236, 46, 96, 44, 'b')}${label(284, 73, 'SAMPLE B', 'lb')}`;
  const lig = x => `<circle class="mark" data-k="lig" cx="${x}" cy="26" r="9"/>`;
  return stepper('sample-steps', 'SAMPLE: a three-step figure', [
    ['The first state: the thing that moves starts at A.', frame + lig(76)],
    ['It moves to B. Because it carries the same data-k, it glides rather than reappearing.', frame + lig(284) +
      `<path class="arrow" data-k="ar" d="M136 68 L224 68"/>`],
    ['A new shape appears, so it fades in; nothing that stayed is redrawn.', frame + lig(284) +
      `<path class="arrow" data-k="ar" d="M136 68 L224 68"/>` +
      `<rect class="mark" x="236" y="98" width="96" height="10" rx="5" opacity="0.45"/>` +
      `<text class="lbl xs" x="284" y="122" text-anchor="middle">a response at B</text>`],
  ], 170, 'Sample step-through. Replace it with a figure of the course’s own.');
})();

/* Inline SVG a question can show in its concept block via `svg: DIA.key`, a
   reading tab via <!--DIA:key-->, and the Diagrams tab via DIAGRAMS. */
const DIA = {
  'sample-steps': SAMPLE_STEPS,
};

/* The Diagrams tab: [group name, [figure keys]]. Course-specific — group the
   figures the way the course groups the processes they show. A key that is not
   in DIA is skipped, and the tab hides itself when nothing is listed. */
const DIAGRAMS = [
  ['Sample figures', ['sample-steps']],
];

/* A figure's own title, used by the Diagrams tab's contents chips when a key
   needs a name different from the title drawn inside it. */
const DIA_NAMES = {};

  {t:'As a number only, such as #20', correct:false, why:'A number alone is not enough for a written controlled substance prescription (slide 18).'},
  {t:'As a word only, such as twenty', correct:false, why:'Slide 18 requires the quantity both numerically and written as a word, for example #20 (twenty), not a word alone.'},
  {t:'As the days’ supply only', correct:false, why:'Slide 18 asks for the quantity in two forms, not a days’ supply.'}],
 teach:'(T) Showing the quantity two ways helps prevent diversion, because a written number is harder to alter without being noticed.',
 cite:'Intro-to-Dispensing.pdf slide 18; 8/24 transcript (T)'},

{id:'d15', skill:'apply', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'req', concept:'quantity-word-action',
 tags:['requirements','controlled'], source:'slide',
 stem:'A written CIV prescription shows the quantity only as “#30,” with no word. What should the pharmacist do?',
 options:[
  {t:'Call to verify the quantity', correct:true, why:'Slide 18 footnote: if it is not written as a word, the pharmacist should call to verify the quantity per the Texas State Board of Pharmacy (TSBP).'},
  {t:'Fill it as written', correct:false, why:'The word form is required on a written prescription (slide 18).'},
  {t:'Write the word on it', correct:false, why:'The slide directs a call, not an edit to the prescription (slide 18).'},
  {t:'Fill half and have the patient return', correct:false, why:'The slide describes verifying the quantity, not splitting the fill (slide 18).'}],
 teach:'A written controlled substance prescription needs the quantity as a number and a word. When the word is missing, call to verify.',
 cite:'Intro-to-Dispensing.pdf slide 18'},

{id:'d16', skill:'recall', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'req', concept:'animal-rx',
 tags:['requirements'], source:'both',
 stem:'A prescription is written for a dog. Besides the usual drug information, what must it include?',
 options:[
  {t:'The species and owner’s name', correct:true, why:'Slides 16 and 18: required when the prescription is for an animal. (T) The lecturer’s example is a dog named Jimmy with her name as owner.'},
  {t:'The animal’s weight and breed', correct:false, why:'Slides 16 and 18 ask for the animal’s species and the owner’s name; weight and breed are not listed.'},
  {t:'The owner’s date of birth only', correct:false, why:'The owner’s name is required, not the date of birth (slide 16).'},
  {t:'A TSBP official prescription form', correct:false, why:'Slide 20 requires the TSBP-issued official form for a written CII prescription, not for an animal prescription.'}],
 teach:'For an animal, the prescription needs the species and the name of the owner in every category.',
 cite:'Intro-to-Dispensing.pdf slides 16, 18; 8/24 transcript (T)'},

{id:'d17', skill:'apply', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'req', concept:'indication',
 tags:['requirements'], source:'both',
 stem:'A dangerous-drug prescription has no indication written on it. What is the practical action?',
 options:[
  {t:'Fill it; the prescriber may omit the indication', correct:true, why:'Slide 16: required unless the practitioner determines it is not in the patient’s best interest. (T) Calling the prescriber for this is not expected.'},
  {t:'Refuse it until the prescriber adds an indication', correct:false, why:'(T) The indication may be omitted when the prescriber judges that best, so refusal is not required.'},
  {t:'Call the prescriber about every missing indication', correct:false, why:'(T) Not expected; the lecturer said nobody has time for that.'},
  {t:'Add the likely indication from the drug', correct:false, why:'Slide 16 describes the prescriber’s intended use; it does not describe the pharmacist adding one.'}],
 teach:'(T) By law the intended use should be on the prescription unless the practitioner determines it is not in the patient’s best interest, so a missing indication is not by itself a reason to refuse.',
 cite:'Intro-to-Dispensing.pdf slide 16; 8/24 transcript (T)'},

{id:'d18', skill:'recall', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'req', concept:'cii-written-form',
 tags:['requirements','CII'], source:'both',
 stem:'A written CII prescription must be on which form and signed how?',
 options:[
  {t:'A TSBP official form, manually signed', correct:true, why:'Slide 20. (T) A stamped or replica signature does not qualify.'},
  {t:'Any form, signed with a stamp', correct:false, why:'(T) The prescriber cannot stamp the signature on a written CII.'},
  {t:'A TSBP official form, signed with a stamp', correct:false, why:'Slide 20 requires a written CII to be manually signed, and slide 27 says no stamp or replica signature for CII.'},
  {t:'Any form, signed electronically', correct:false, why:'An electronic signature belongs to an e-prescription (slide 27), not a written one.'}],
 teach:'If a CII prescription is written (not ideal), it must be on a TSBP-issued official form and manually signed. On the back, the pharmacist records the date filled and the Rx number.',
 cite:'Intro-to-Dispensing.pdf slides 20, 27; 8/24 transcript (T)'},

{id:'d19', skill:'recall', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'req', concept:'cii-record',
 tags:['requirements','CII'], source:'both',
 stem:'What must the pharmacist record on a filled CII prescription?',
 options:[
  {t:'The date filled and the Rx number', correct:true, why:'Slide 20. (T) The record lets auditors track the controlled medication.'},
  {t:'The pharmacist’s initials only', correct:false, why:'Slide 20 names the date filled and the Rx number, not initials, as what the pharmacist records.'},
  {t:'The patient’s insurance number and plan', correct:false, why:'Slide 20 lists no insurance information; the pharmacist records the date filled and the Rx number.'},
  {t:'The prescriber’s DEA number', correct:false, why:'The DEA number must already be on the prescription (slide 18); the pharmacist records the fill date and Rx number.'}],
 teach:'(T) The pharmacist writes the fill date and the Rx number so a later audit can track the CII.',
 cite:'Intro-to-Dispensing.pdf slide 20; 8/24 transcript (T)'},

{id:'d20', skill:'recall', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'req', concept:'cii-electronic',
 tags:['requirements','CII'], source:'both',
 stem:'Which delivery method is preferred for controlled substance prescriptions, except in limited circumstances?',
 note:'Slide 21 states this for controlled substances; (T) the lecturer said it about CII. Both key electronic delivery.',
 options:[
  {t:'Electronically', correct:true, why:'Slide 21; (T) the prescriber, not the pharmacist, is responsible for sending it electronically.'},
  {t:'Handwritten on an official form', correct:false, why:'Slide 20 allows a written CII on a TSBP form but calls it not ideal; slide 21 says electronic issue is the standard.'},
  {t:'Verbally by phone', correct:false, why:'Verbal orders appear for substitution (slide 24), not as the standard route on slide 21.'},
  {t:'By fax to the pharmacy', correct:false, why:'Slide 21 says controlled substance prescriptions should be issued electronically, not by fax, except in limited circumstances.'}],
 teach:'(T) The pharmacist does not have to double-check that a prescriber used electronic delivery, but should know the law prefers it.',
 cite:'Intro-to-Dispensing.pdf slides 20–21; 8/24 transcript (T)'},

{id:'d21', skill:'recall', prof:'Dr. Lahoud', multi:true, tier:'new', topic:'dispensing', sub:'req', concept:'pmp',
 tags:['requirements','controlled'], source:'slide',
 stem:'Pharmacists must check the patient’s prescription monitoring program (PMP) history before dispensing which of these? Select all that apply.',
 options:[
  {t:'Opioids', correct:true, why:'Slide 21 lists opioids among the drugs that require a PMP history check before dispensing.'},
  {t:'Benzodiazepines', correct:true, why:'Slide 21 lists benzodiazepines among the drugs that require a PMP history check before dispensing.'},
  {t:'Barbiturates', correct:true, why:'Slide 21 lists barbiturates among the drugs that require a PMP history check before dispensing.'},
  {t:'Carisoprodol', correct:true, why:'Slide 21 lists carisoprodol among the drugs that require a PMP history check before dispensing.'},
  {t:'Statins', correct:false, why:'Slide 21 names only opioids, benzodiazepines, barbiturates and carisoprodol for the PMP check; statins are not named.'},
  {t:'ACE inhibitors', correct:false, why:'Slide 21 names only opioids, benzodiazepines, barbiturates and carisoprodol for the PMP check; ACE inhibitors are not named.'}],
 teach:'Pharmacists and prescribers (other than veterinarians) check the PMP before dispensing or prescribing opioids, benzodiazepines, barbiturates or carisoprodol.',
 cite:'Intro-to-Dispensing.pdf slide 21'},

{id:'d22', skill:'tell', prof:'Dr. Lahoud', multi:true, tier:'new', topic:'dispensing', sub:'req', concept:'ciiv-vs-dangerous',
 tags:['requirements','controlled'], source:'slide',
 stem:'Which are required on a written CIII–CV prescription but not on a dangerous-drug prescription? Select all that apply.',
 options:[
  {t:'Prescriber’s DEA number', correct:true, why:'Slide 18 requires the prescriber’s DEA number on CIII–V, while slide 16 lists none for dangerous drugs.'},
  {t:'Patient date of birth on the prescription', correct:true, why:'Slide 18; on a dangerous-drug prescription it may be in the PMR instead (slide 16).'},
  {t:'Quantity written as a word', correct:true, why:'Slide 18 requires the quantity as a word when the order is written; slide 16 has no such requirement.'},
  {t:'Directions for use', correct:false, why:'Slides 16 and 18 both require directions for use, so it does not separate the two categories.'},
  {t:'Date of issuance', correct:false, why:'Slides 16 and 18 both require the date of issuance, so it does not separate the two categories.'}],
 teach:'CIII–V adds the DEA number, the date of birth on the prescription, and the quantity as a word (when written) to the dangerous-drug list.',
 cite:'Intro-to-Dispensing.pdf slides 16, 18, 27'},

/* ---- refills and expiration ------------------------------------------- */
{id:'d23', skill:'recall', type:'match', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'refill', concept:'refill-table',
 tags:['refills','expiration'], source:'slide',
 stem:'Match each prescription category to its refill limit and the time after issue when the script expires.',
 left:'Category', right:'Refills and expiration',
 pairs:[
  {l:'Dangerous drug', r:'No limit; 1 year', why:'Slide 22 gives dangerous drugs no refill limit and a script expiration of 1 year after issuance.'},
  {l:'Schedule III–V', r:'5 refills; 6 months', why:'Slide 22 gives Schedule III–V a limit of 5 refills and a script expiration of 6 months after issuance.'},
  {l:'Schedule II', r:'0 refills; 30 days', why:'Slide 22 gives Schedule II 0 refills and a script expiration of 30 days after issuance.'}],
 teach:'Refill limits and script expiration depend on the category: dangerous drugs no limit and 1 year; CIII–V 5 refills and 6 months; CII no refills and 30 days. Slide 22’s footnote adds 3 months for mid-level practitioners; the lecture did not stress it.',
 cite:'Intro-to-Dispensing.pdf slide 22'},

{id:'d24', skill:'apply', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'refill', concept:'dangerous-refills',
 tags:['refills','expiration'], source:'both',
 stem:'A prescription for Prozac (fluoxetine, a dangerous drug) was issued 8/18/2026 with 6 refills. Are the refills acceptable, and when does the script expire?',
 options:[
  {t:'Acceptable; it expires 8/18/2027', correct:true, why:'Dangerous drugs have no refill limit and expire 1 year after issue (slide 22); 8/18/2026 plus one year is 8/18/2027.'},
  {t:'Not acceptable; the maximum is 5 refills', correct:false, why:'5 refills is the CIII–V limit; dangerous drugs have no limit (slide 22).'},
  {t:'Acceptable; it expires 2/18/2027', correct:false, why:'2/18/2027 is six months after 8/18/2026, the CIII–V expiration; slide 22 gives dangerous drugs 1 year.'},
  {t:'Not acceptable; refills are not allowed', correct:false, why:'No refills is the CII rule; slide 22 gives dangerous drugs no refill limit, so 6 refills is acceptable.'}],
 teach:'(T) The Prozac example on slides 31–33 was judged legal and safe: dangerous drugs have no refill limit and are valid 1 year from the date of issuance.',
 cite:'Intro-to-Dispensing.pdf slides 22, 31; 8/24 transcript (T)'},

{id:'d25', skill:'apply', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'refill', concept:'ciiv-expired',
 tags:['refills','expiration'], source:'slide',
 stem:'A physician issued a CIV prescription for alprazolam 6 months and 2 weeks ago. May it be filled?',
 options:[
  {t:'No, it expired after 6 months', correct:true, why:'Slide 22 gives CIII–V scripts 6 months after issue, and this one is 6 months and 2 weeks old.'},
  {t:'Yes, it is valid for 1 year', correct:false, why:'One year is the dangerous-drug expiration on slide 22; alprazolam is a CIV, which expires at 6 months.'},
  {t:'Yes, it is valid for 30 days after the last fill', correct:false, why:'Thirty days is the CII expiration on slide 22, counted from the date of issuance, not from the last fill.'},
  {t:'Yes, if refills remain', correct:false, why:'Refills do not extend the 6-month expiration of a CIII–V script (slide 22); an expired prescription needs a new one (slides 38–39).'}],
 teach:'A prescription that has passed its expiration is a prescribing error; contact the prescriber for a new prescription.',
 cite:'Intro-to-Dispensing.pdf slides 22, 38'},

{id:'d26', skill:'recall', prof:'Dr. Lahoud', multi:true, tier:'new', topic:'dispensing', sub:'refill', concept:'cii-multi-rx',
 tags:['refills','CII'], source:'slide',
 stem:'Which conditions must be met when a prescriber issues several CII prescriptions for up to a 90-day supply? Select all that apply.',
 options:[
  {t:'The total is no more than a 90-day supply', correct:true, why:'Slide 22 allows multiple CII prescriptions only if the total is no more than a 90-day supply.'},
  {t:'All prescriptions are issued the same day', correct:true, why:'Slide 22 requires the multiple CII prescriptions to be issued on the same day.'},
  {t:'The prescriber notes an earliest fill date', correct:true, why:'Slide 22 requires the prescriber to note an earliest fill date on the multiple CII prescriptions.'},
  {t:'Each prescription carries 2 refills', correct:false, why:'Slide 22 gives CII 0 refills, so a CII prescription cannot carry refills.'},
  {t:'Each prescription is issued on a different date', correct:false, why:'Slide 22 requires the prescriptions to be issued the same day, not on different dates.'}],
 teach:'(T) This is the legal way around the no-refill rule: separate prescriptions issued the same day, with earliest fill dates, totaling at most a 90-day supply.',
 cite:'Intro-to-Dispensing.pdf slide 22; 8/24 transcript (T)'},

{id:'d27', skill:'apply', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'refill', concept:'cii-earliest-fill',
 tags:['refills','CII'], source:'both',
 stem:'Three Focalin XR prescriptions were all issued 8/24/2026. The second states an earliest fill date of 9/24/2026. May the second be filled on 9/10/2026?',
 options:[
  {t:'No, not before 9/24/2026', correct:true, why:'(T) The script cannot be filled before the earliest fill date the prescriber noted (slide 23).'},
  {t:'Yes, it was issued the same day as the first', correct:false, why:'The earliest fill date controls when it can be filled, not the issue date (slide 22).'},
  {t:'Yes, if the patient asks', correct:false, why:'A patient request does not change the prescriber’s earliest fill date (slide 22).'},
  {t:'No, CII prescriptions cannot be split', correct:false, why:'Multiple CII prescriptions are allowed under slide 22’s conditions.'}],
 teach:'(T) Focalin XR is a CII. The first script fills now, the second on or after 9/24/2026, and the third on or after 10/24/2026 (slide 23), which totals a 90-day supply.',
 cite:'Intro-to-Dispensing.pdf slides 22–23; 8/24 transcript (T)'},

/* ---- generic substitution --------------------------------------------- */
{id:'d28', skill:'recall', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'subst', concept:'brand-written',
 tags:['substitution'], source:'both',
 stem:'On a written prescription, which method legally prevents generic substitution?',
 options:[
  {t:'The prescriber handwrites “Brand Necessary”', correct:true, why:'Slide 24: for a written prescription, handwrite “Brand Necessary” or “Brand Medically Necessary.”'},
  {t:'A pre-printed check box is marked', correct:false, why:'Slide 24 lists checkboxes among the methods that do not legally prevent generic substitution on a written prescription.'},
  {t:'A rubber stamp reads brand medically necessary', correct:false, why:'Rubber stamps do not legally prevent substitution (slide 24).'},
  {t:'A two-line prescription form is signed', correct:false, why:'Two-line forms do not legally prevent substitution (slide 24).'}],
 teach:'(T) On a written prescription the prescriber has to write it by hand. A pre-written box, a stamp or preprinted wording is not enough.',
 cite:'Intro-to-Dispensing.pdf slide 24; 8/24 transcript (T)'},

{id:'d29', skill:'recall', dupOf:'d28', prof:'Dr. Lahoud', multi:true, tier:'new', topic:'dispensing', sub:'subst', concept:'brand-written',
 tags:['substitution'], source:'slide',
 stem:'Which of these do NOT legally prevent generic substitution on a written prescription? Select all that apply.',
 options:[
  {t:'Checkboxes', correct:true, why:'Slide 24 lists checkboxes as a method that does not legally prevent generic substitution on a written prescription.'},
  {t:'Two-line prescription forms', correct:true, why:'Slide 24 lists two-line prescription forms as a method that does not legally prevent generic substitution.'},
  {t:'Preprinted wording', correct:true, why:'Slide 24 lists preprinted wording as a method that does not legally prevent generic substitution.'},
  {t:'Rubber stamps', correct:true, why:'Slide 24 lists rubber stamps as a method that does not legally prevent generic substitution.'},
  {t:'Handwritten “Brand Necessary”', correct:false, why:'This is the method that does prevent substitution (slide 24).'}],
 teach:'Only handwriting “Brand Necessary” or “Brand Medically Necessary” prevents substitution on a written prescription.',
 cite:'Intro-to-Dispensing.pdf slide 24'},

{id:'d30', skill:'tell', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'subst', concept:'brand-by-type',
 tags:['substitution'], source:'both',
 stem:'A prescriber phones in a prescription and states that the brand is medically necessary. What makes that statement effective?',
 options:[
  {t:'The pharmacist documents the statement', correct:true, why:'Slide 24: for an oral order, the prescriber states it verbally and the pharmacist documents it.'},
  {t:'The prescriber also faxes a signed form', correct:false, why:'Slide 24 says an oral request needs only the verbal statement and the pharmacist’s documentation, not a faxed form.'},
  {t:'The pharmacy records it on a stamp', correct:false, why:'Stamps are listed as not preventing substitution on written prescriptions (slide 24).'},
  {t:'A verbal request cannot prevent substitution', correct:false, why:'Slide 24 lists the oral route as valid: the prescriber states it verbally and the pharmacist documents it.'}],
 teach:'(T) Written: handwritten. Oral: stated verbally and documented by the pharmacist. Electronic: clearly indicated in the e-prescription (in lab, assume prescriptions arrive electronically).',
 cite:'Intro-to-Dispensing.pdf slide 24; 8/24 transcript (T)'},

/* ---- product expiration ----------------------------------------------- */
{id:'d31', skill:'recall', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'expiry', concept:'constituted-expiry',
 tags:['expiration','compounded'], source:'both',
 stem:'An Augmentin suspension is mixed at the pharmacy. What expiration applies?',
 options:[
  {t:'Discard 10 days after mixing', correct:true, why:'Slide 25: check the product’s own directions; Augmentin suspension is discarded 10 days after mixing.'},
  {t:'One year after the fill date', correct:false, why:'That rule is for products taken from a stock bottle (slide 25).'},
  {t:'The stock bottle’s printed expiration', correct:false, why:'Once water is added it is no longer the powder that was on the shelf (T), so the product’s directions apply.'},
  {t:'Thirty days after the fill date', correct:false, why:'Slide 25 gives no thirty-day rule; a mixed product follows its own directions, such as 10 days for Augmentin suspension.'}],
 teach:'(T) Unconstituted powder has a stock expiration, but once water is added it has its own, found on the bottle’s label (for example, discard after 10 days from reconstitution).',
 cite:'Intro-to-Dispensing.pdf slide 25; 8/24 transcript (T)'},

{id:'d32', skill:'apply', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'expiry', concept:'stock-expiry-1',
 tags:['expiration','label date'], source:'both',
 stem:'Lisinopril is filled 8/24/2026 from a stock bottle that expires 2/2027. What expiration date goes on the label?',
 options:[
  {t:'02/28/2027', correct:true, why:'The stock expiration is earlier than one year after fill, and the label takes the last day of that month; (T) the lecture gave 2-28-2027 for a 2/2027 bottle.'},
  {t:'08/24/2027', correct:false, why:'One year after the fill date is used only if it is earlier than the stock expiration (slide 25).'},
  {t:'02/01/2027', correct:false, why:'The expiration is the end of the month; the key uses 1/31/2027 for a 1/2027 bottle (EOOR key, station 10).'},
  {t:'Cannot use the stock bottle', correct:false, why:'The bottle is still in date on 8/24/2026; it only sets an earlier label date.'}],
 teach:'The label date is the earlier of one year after fill and the stock bottle’s expiration. A month-and-year stock date runs to the last day of that month.',
 cite:'Intro-to-Dispensing.pdf slides 25–26; 8/24 transcript (T); EOOR-Answer-Key.pdf station 10'},

{id:'d33', skill:'apply', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'expiry', concept:'stock-expiry-2',
 tags:['expiration','label date'], source:'slide',
 stem:'A prescription is filled 3/1/2026 from a stock bottle that expires 8/2027. What expiration date goes on the label?',
 options:[
  {t:'03/01/2027', correct:true, why:'One year after the fill date is earlier than the stock expiration of 8/2027 (slide 25).'},
  {t:'08/31/2027', correct:false, why:'The stock date is later than one year after fill, so the earlier date is used (slide 25).'},
  {t:'03/31/2027', correct:false, why:'One year after a 3/1/2026 fill is 3/1/2027, not the end of that month (slide 25).'},
  {t:'08/01/2027', correct:false, why:'Uses the stock bottle’s month; the earlier date, one year after fill, applies (slide 25).'}],
 teach:'Compare one year after the fill date with the stock bottle’s expiration, and use the earlier. Check: 3/1/2026 plus one year is 3/1/2027, which is before 8/2027.',
 cite:'Intro-to-Dispensing.pdf slide 25'},

{id:'d34', skill:'apply', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'expiry', concept:'stock-expiry-3',
 tags:['expiration','label date'], source:'both',
 stem:'A prescription is filled 10/15/2026 from a stock bottle that expires 12/2026. What expiration date goes on the label?',
 options:[
  {t:'12/31/2026', correct:true, why:'The stock expiration is earlier than one year after fill (slide 25), and a month-and-year date runs to the last day of the month (EOOR key, station 10).'},
  {t:'10/15/2027', correct:false, why:'One year after fill is later than the stock expiration, so it is not used (slide 25).'},
  {t:'12/01/2026', correct:false, why:'The date should be the end of the month, as in the 1/2027 to 1/31/2027 example (EOOR key, station 10).'},
  {t:'12/15/2026', correct:false, why:'A month-and-year stock date runs to the end of that month, so the label takes the last day (EOOR key, station 10).'}],
 teach:'The earlier date wins. The stock bottle expires before one year after the fill, so the label date is the last day of December 2026.',
 cite:'Intro-to-Dispensing.pdf slides 25–26; EOOR-Answer-Key.pdf station 10'},

/* ---- the three-step review -------------------------------------------- */
{id:'d35', skill:'recall', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'review', concept:'review-order',
 tags:['prescription review'], source:'both',
 stem:'In what order is the systematic approach to reviewing a prescription done?',
 options:[
  {t:'Legal and safe, transcribed correctly, product matches', correct:true, why:'Slide 30; (T) if it is not legal or safe, the prescriber is called before anything is processed.'},
  {t:'Product matches, legal and safe, transcribed correctly', correct:false, why:'Slide 30 puts legal and safe first, so checking the product match first is out of order.'},
  {t:'Transcribed correctly, legal and safe, product matches', correct:false, why:'The prescription must be legal and safe before the transcription is checked (slide 30).'},
  {t:'Transcribed correctly, product matches, legal and safe', correct:false, why:'Slide 30 puts legal and safe first, not last; the order is legal and safe, transcribed, then product match.'}],
 teach:'(1) Is the prescription legal and safe for the patient? (2) Was it transcribed appropriately? (3) Does the in-hand product match the transcribed product?',
 cite:'Intro-to-Dispensing.pdf slide 30; 8/24 transcript (T)'},

{id:'d36', skill:'apply', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'review', concept:'fill-date',
 tags:['prescription review','transcription'], source:'both',
 stem:'A prescription was issued 8/18/2026 and filled 8/24/2026. The label shows a fill date of 8/24/2026. Is the label date an error?',
 options:[
  {t:'No, the label shows the fill date', correct:true, why:'Slide 34: the date of fill will often auto-populate. (T) The label date is when it is filled.'},
  {t:'Yes, the label must show 8/18/2026', correct:false, why:'8/18/2026 is the date of issuance on the prescription (slide 32), not the fill date.'},
  {t:'Yes, the prescription has expired', correct:false, why:'Slide 22 gives a dangerous drug 1 year after issue, so a prescription issued 8/18/2026 had not expired on 8/24/2026.'},
  {t:'No, but the label needs both dates', correct:false, why:'Slide 34 checks only the date of fill on the label; the issue date belongs to the prescription (slide 32).'}],
 teach:'(T) The prescription date and the fill date are different. Filling a prescription written 8/18 on 8/24 is correct as long as it has not expired.',
 cite:'Intro-to-Dispensing.pdf slides 32, 34; 8/24 transcript (T)'},

{id:'d37', skill:'recall', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'review', concept:'safety-resources',
 tags:['prescription review','safety'], source:'both',
 stem:'Which resources are used to check that a prescribed dose is safe for a patient?',
 options:[
  {t:'Lexicomp/Lexidrug and Micromedex', correct:true, why:'Slides 44–45 name Lexicomp or Micromedex and allow Lexidrug and Micromedex in lab; (T) the lecturer wants them used to assess whether a prescription is safe, not only whether it is legal.'},
  {t:'The patient’s memory of the last fill', correct:false, why:'A patient’s memory of a past fill is not a drug reference; slide 45 names Lexidrug and Micromedex as the resources to use.'},
  {t:'The pharmacy’s inventory list', correct:false, why:'Inventory shows what is stocked, not whether a dose is safe.'},
  {t:'The previous prescription label', correct:false, why:'A label is not a drug reference; (T) safety is checked in Lexicomp or Micromedex.'}],
 teach:'(T) Legality and safety are equally important. Use Lexicomp or Micromedex to check, for example, whether lisinopril 20 mg once a day is safe for the patient.',
 cite:'Intro-to-Dispensing.pdf slides 44–45; 8/24 transcript (T)'},

{id:'d38', skill:'recall', prof:'Dr. Lahoud', tier:'new', topic:'dispensing', sub:'review', concept:'lasa',
 tags:['prescription review','LASA'], source:'both',
 stem:'In prescription verification, what does LASA stand for?',

  {t:'Call the prescriber to change the order to IR', correct:false, why:'The prescriber ordered ER; the pharmacy filled the wrong product (EOOR key, station 10).'},
  {t:'Relabel the IR product as ER and dispense it', correct:false, why:'The product itself is wrong; relabeling does not fix it (slide 39).'},
  {t:'Counsel the patient to take the IR product more often', correct:false, why:'This changes therapy without a prescriber; the error must be corrected (slide 39).'}],
 teach:'ER versus IR is part of product verification (formulation). The fix for a wrong formulation is to replace the product.',
 cite:'EOOR-Answer-Key.pdf slide 1; Intro-to-Dispensing.pdf slides 36, 39'},

{id:'e15', skill:'error', dupOf:'d34', prof:'Dr. Lahoud', tier:'new', topic:'eoor', sub:'spot', concept:'eoor-use-before',
 tags:['EOOR','label date'], source:'slide',
 stem:'The stock bottle expires 1/2027 and the label’s “Use Before” date is incorrect. What date belongs on the label, if one year after fill is later?',
 options:[
  {t:'1/31/2027', correct:true, why:'EOOR key, station 10: bottle expires 1/2027, so the expiration should be 1/31/2027.'},
  {t:'1/1/2027', correct:false, why:'The key uses the last day of the month, not the first (EOOR key, station 10).'},
  {t:'1/15/2027', correct:false, why:'A mid-month date is not the stock expiration (EOOR key, station 10).'},
  {t:'12/31/2026', correct:false, why:'This is the end of the month before; the bottle is good through 1/2027 (EOOR key, station 10).'}],
 teach:'The use-before date is the earlier of one year after fill and the stock bottle’s expiration; a stock date given as month and year runs to the end of that month.',
 cite:'EOOR-Answer-Key.pdf slide 2; Intro-to-Dispensing.pdf slide 25'},

{id:'e16', skill:'error', prof:'Dr. Lahoud', tier:'new', topic:'eoor', sub:'spot', concept:'eoor-prn-reason',
 tags:['EOOR'], source:'slide',
 stem:'The prescription reads “every 6 hours as needed for pain,” but the label omits the reason for as-needed use. What type of error is this?',
 options:[
  {t:'Transcribing error; fix the directions', correct:true, why:'EOOR key, station 12: label does not indicate the prn reason; directions transcribed incorrectly onto the label.'},
  {t:'Prescribing error; call the prescriber', correct:false, why:'The prescription states the reason; the label dropped it (EOOR key, station 12).'},
  {t:'Dispensing error; replace the product', correct:false, why:'The product is not the problem; the directions on the label are (EOOR key, station 12).'},
  {t:'No error; the label is acceptable', correct:false, why:'The key lists the missing prn reason as an error at station 12, so the label is not acceptable (EOOR key).'}],
 teach:'The sig is checked as prescribed, including the as-needed reason. Missing parts of the sig are a transcribing error.',
 cite:'EOOR-Answer-Key.pdf slide 2; Intro-to-Dispensing.pdf slide 38'},

{id:'e17', skill:'error', prof:'Dr. Lahoud', tier:'new', topic:'eoor', sub:'spot', concept:'eoor-product-expired',
 tags:['EOOR'], source:'slide',
 stem:'The prescription is valid, but the stock bottle used to fill it is past its expiration date. What is the correction?',
 options:[
  {t:'Get a fresh bottle with the technician', correct:true, why:'EOOR key, station 12: product used for dispensing is expired; get a fresh bottle.'},
  {t:'Call the prescriber for a new prescription', correct:false, why:'The prescription is not expired; the product is (EOOR key, station 12).'},
  {t:'Relabel with the stock expiration date', correct:false, why:'The key’s correction is to get a fresh bottle, not to relabel the expired product (EOOR key, station 12; slide 38).'},
  {t:'Dispense it with a counseling note', correct:false, why:'Slide 38 lists an expired dispensing product as an error; the key’s correction is a fresh bottle (station 12).'}],
 teach:'Product used for dispensing is expired is a dispensing error. It differs from an expired prescription, which is a prescribing error.',
 cite:'EOOR-Answer-Key.pdf slide 2; Intro-to-Dispensing.pdf slide 38'},

{id:'e18', skill:'error', prof:'Dr. Lahoud', tier:'new', topic:'eoor', sub:'fix', concept:'eoor-cii-expired',

 stem:'A CII prescription was written more than a month ago. What is the correction?',

  {t:'Call the prescriber for a new prescription', correct:true, why:'EOOR key, station 13: expired, more than 1 month for CIIs. Slide 22 gives the CII period as 30 days.'},
  {t:'Fill it with one refill', correct:false, why:'Slide 22 lists 0 refills for Schedule II; the key’s correction for an expired CII is a new prescription (station 13).'},
  {t:'Work with the technician to relabel', correct:false, why:'A relabel does not make an expired script valid (EOOR key, station 13).'},
  {t:'Fill it if the patient presents the original', correct:false, why:'Possession of the paper does not extend the 30-day expiration (slide 22).'}],

{id:'e19', skill:'error', prof:'Dr. Lahoud', tier:'new', topic:'eoor', sub:'fix', concept:'eoor-cii-refills',
 tags:['EOOR','CII'], source:'slide',
 stem:'A CII prescription lists refills. What is the error and the action?',
 options:[
  {t:'Prescribing error; call the provider', correct:true, why:'EOOR key, station 13: CII cannot have refills; call the provider.'},
  {t:'Transcribing error; correct the label', correct:false, why:'The refills are on the prescription itself (EOOR key, station 13).'},
  {t:'Dispensing error; replace the product', correct:false, why:'The product is not the problem; the refills prescribed on the CII are (EOOR key, station 13).'},

{id:'e20', skill:'error', prof:'Dr. Lahoud', multi:true, tier:'new', topic:'eoor', sub:'fix', concept:'eoor-work-with-tech',
 tags:['EOOR'], source:'slide',
 stem:'Which of these errors are corrected by working with the technician? Select all that apply.',

  {t:'Incorrect patient processed', correct:true, why:'The key corrects an incorrect patient selected or processed by working with the technician (EOOR key, station 4).'},
  {t:'Number of refills transcribed wrongly onto the label', correct:true, why:'The key corrects refills transcribed incorrectly onto the label by working with the technician (EOOR key, station 4).'},
  {t:'Product used is expired', correct:true, why:'The key corrects a product used for dispensing that is expired by working with the technician to get a fresh bottle (EOOR key, station 12).'},
  {t:'The DEA number is missing', correct:false, why:'The key says to contact the prescriber for a missing DEA number (EOOR key, stations 6 and 13).'},
  {t:'A CII has refills', correct:false, why:'The key says to call the provider when a CII has refills prescribed (EOOR key, station 13).'}],

 options:[

  {t:'Dibucaine and phenol', correct:false, why:'Dibucaine and phenol have the most potential for adverse effects (APhA excerpt).'},
  {t:'Benzocaine and dibucaine', correct:false, why:'Slide 24 says to avoid dibucaine because of systemic toxicity, so this pair is not the safest.'},
  {t:'Lidocaine, benzocaine and phenol', correct:false, why:'Slide 24 names pramoxine and benzyl alcohol, not lidocaine, benzocaine or phenol, as least likely to cause adverse effects.'}],
 teach:'Local anesthetics cause a reversible blockade of nerve impulse conduction at the site of application, relieving pain and also itching and irritation.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slide 24; APhA-Insect-Excerpt.pdf'},

{id:'o17', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'otc', sub:'sting', concept:'dibucaine',
 tags:['local anesthetics'], source:'slide',
 stem:'Which local anesthetic should be avoided because of the risk of systemic toxicity, including seizures and arrhythmias?',
 options:[
  {t:'Dibucaine', correct:true, why:'Slide 24: avoid dibucaine; seizures, respiratory depression, arrhythmias and death.'},
  {t:'Pramoxine', correct:false, why:'Slide 24 says pramoxine and benzyl alcohol do not commonly cause adverse effects, unlike dibucaine.'},
  {t:'Benzyl alcohol', correct:false, why:'Slide 24 says benzyl alcohol is better tolerated than other local anesthetics; dibucaine is the one to avoid.'},
  {t:'Lidocaine', correct:false, why:'Slide 24 singles out dibucaine, not lidocaine, as the agent to avoid for systemic toxicity.'}],
 teach:'Dibucaine is a common allergen and may cause systemic toxicity if too much is absorbed.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slide 24; APhA-Insect-Excerpt.pdf'},

{id:'o18', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'otc', sub:'sting', concept:'phenol',
 tags:['local anesthetics'], source:'slide',
 stem:'Which statement about phenol in a bite product is correct?',
 options:[
  {t:'Avoid it in pregnancy, infants and children', correct:true, why:'Slide 24 says not to use phenol in pregnancy or in infants or children.'},
  {t:'Concentrations above 2% are best for large areas', correct:false, why:'Above 2% is irritating and may cause sloughing and necrosis; avoid large areas (slide 24).'},
  {t:'Apply it under bandages for stronger effect', correct:false, why:'Do not apply under bandages because of skin damage and systemic absorption (slide 24).'},
  {t:'It is the safest local anesthetic', correct:false, why:'Pramoxine and benzyl alcohol have fewer adverse effects (slide 24).'}],
 teach:'Phenol above 2% is irritating and may cause sloughing and necrosis of skin. Do not apply to large areas or under bandages.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slide 24'},

{id:'o19', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'otc', sub:'sting', concept:'topical-diphenhydramine',
 tags:['antihistamine'], source:'slide',
 stem:'How is topical diphenhydramine used for insect bites?',
 options:[
  {t:'3–4 times daily for no longer than 7 days', correct:true, why:'Slide 25 says topical diphenhydramine is applied 3–4 times daily for no longer than 7 days.'},
  {t:'Once daily for up to 4 weeks', correct:false, why:'Slide 25 limits use to 7 days; use beyond 3–4 weeks increases the possibility of contact dermatitis.'},
  {t:'As needed with no limit', correct:false, why:'Slide 25 says topical diphenhydramine is applied for no longer than 7 days, so there is a limit.'},
  {t:'3–4 times daily, continued for up to 4 weeks', correct:false, why:'Slide 25 caps use at 7 days; continued use for 3–4 weeks increases the possibility of contact dermatitis.'}],
 teach:'Topical antihistamines depress cutaneous histamine receptors and are approved for temporary relief of pain and itching. They may be less effective than other options and can cause photosensitivity and hypersensitivity.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slide 25; APhA-Insect-Excerpt.pdf'},

{id:'o20', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'otc', sub:'sting', concept:'hydrocortisone-1',
 tags:['hydrocortisone'], source:'slide',
 stem:'A patient uses hydrocortisone 1% for a minor insect bite. For how long may it be used before medical attention is needed?',
 options:[
  {t:'Up to 7 days', correct:true, why:'Slide 27: apply for up to 7 days; seek medical attention if needed longer.'},
  {t:'Up to 3 days', correct:false, why:'Slide 27 says to apply hydrocortisone 1% for up to 7 days, not 3 days.'},
  {t:'Up to 14 days', correct:false, why:'Slide 27 says to apply hydrocortisone 1% for up to 7 days, not 14 days.'},
  {t:'Up to 30 days', correct:false, why:'Slide 27 says to apply hydrocortisone 1% for up to 7 days, not 30 days.'}],
 teach:'Hydrocortisone 1% is a very weak steroid indicated for temporary relief of minor insect bites.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slide 27'},

{id:'o21', skill:'apply', prof:'Dr. Parsons', tier:'new', topic:'otc', sub:'sting', concept:'hydrocortisone-caution',
 tags:['hydrocortisone'], source:'slide',
 stem:'Why should a patient with scabies or a bacterial or fungal infection not use hydrocortisone without medical supervision?',
 options:[
  {t:'It can worsen or mask the infection', correct:true, why:'APhA excerpt, Product Selection Guidelines: hydrocortisone can worsen or mask scabies, bacterial and fungal infections.'},
  {t:'It causes systemic toxicity', correct:false, why:'Short-term hydrocortisone does not usually cause clinically significant systemic absorption (APhA excerpt).'},
  {t:'It is not approved for insect bites', correct:false, why:'Hydrocortisone 1% is indicated for minor insect bites (slide 27).'},
  {t:'It interacts with antiparasitic drugs', correct:false, why:'No such interaction is described; the excerpt’s concern is that it can worsen or mask the disorder.'}],
 teach:'Scabies and secondary infection need medical evaluation (slide 14); the APhA excerpt adds that a steroid can hide or worsen bacterial and fungal infections.',
 cite:'APhA-Insect-Excerpt.pdf; OTC-Insect-Bites-Pediculosis.pdf slide 14'},

{id:'o22', skill:'recall', prof:'Dr. Parsons', multi:true, tier:'new', topic:'otc', sub:'sting', concept:'skin-protectants',
 tags:['skin protectants'], source:'slide',
 stem:'Which statements about skin protectants are correct? Select all that apply.',
 options:[
  {t:'Zinc oxide and calamine are recommended for adults, children and infants', correct:true, why:'Slide 28 says zinc oxide and calamine are recommended for adults, children and infants.'},
  {t:'They may be applied as needed', correct:true, why:'Slide 28 says skin protectants may be applied as needed.'},
  {t:'Zinc oxide works as a mild astringent with weak antiseptic properties', correct:true, why:'Slide 28 says zinc oxide works as a mild astringent and has weak antiseptic properties.'},
  {t:'The FDA has established the safety and efficacy of titanium dioxide', correct:false, why:'Titanium dioxide’s safety and efficacy have not been evaluated by the FDA (slide 28).'},
  {t:'They are limited to 7 days of use', correct:false, why:'Slide 28 says as needed; 7-day limits appear for topical antihistamines and hydrocortisone (slides 25, 27).'}],
 teach:'Skin protectants (zinc oxide, calamine lotion, titanium dioxide) reduce inflammation and irritation and are formulated as lotions, ointments and creams.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slide 28; APhA-Insect-Excerpt.pdf'},

{id:'o23', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'otc', sub:'sting', concept:'camphor-danger',
 tags:['counterirritants'], source:'slide',
 stem:'Which counterirritant is very dangerous if ingested and should be kept away from children and pets?',
 options:[
  {t:'Camphor', correct:true, why:'Slide 26 says camphor is very dangerous if ingested and should be kept away from children and pets.'},
  {t:'Menthol', correct:false, why:'Slide 26 flags camphor, not menthol, as very dangerous if ingested.'},
  {t:'Zinc oxide', correct:false, why:'Slide 28 lists zinc oxide as a skin protectant, not a counterirritant.'},
  {t:'Calamine', correct:false, why:'Slide 28 lists calamine lotion as a skin protectant, not a counterirritant.'}],
 teach:'Camphor and menthol exert a cooling effect; camphor-containing products are an inappropriate choice for children.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slide 26; APhA-Insect-Excerpt.pdf'},

{id:'o24', skill:'recall', dupOf:'o20', prof:'Dr. Parsons', tier:'new', topic:'otc', sub:'sting', concept:'seven-day-rule',
 tags:['duration'], source:'slide',
 stem:'For how long may topical antipruritics and anesthetics be used before a provider’s advice is needed?',
 options:[
  {t:'No more than 7 days', correct:true, why:'APhA excerpt: should not be used for more than 7 days unless a provider advises it.'},
  {t:'No more than 3 days', correct:false, why:'APhA excerpt, Product Selection Guidelines: the limit is 7 days, not 3 days.'},
  {t:'No more than 14 days', correct:false, why:'APhA excerpt, Product Selection Guidelines: the limit is 7 days, not 14 days.'},
  {t:'There is no limit', correct:false, why:'Topical antihistamines and hydrocortisone carry a 7-day limit (slides 25 and 27), and the APhA excerpt gives it for antipruritics and anesthetics.'}],
 teach:'Patients must understand that topical antipruritics and anesthetics should not be used for more than 7 days unless a provider specifically advises it.',
 cite:'APhA-Insect-Excerpt.pdf; OTC-Insect-Bites-Pediculosis.pdf slides 25, 27'},

{id:'o25', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'otc', sub:'lice', concept:'lice-features',
 tags:['pediculosis'], source:'slide',
 stem:'Where are nits and nit castings most easily seen when the hair is parted?',
 options:[
  {t:'Crown, near the ears, base of neck', correct:true, why:'Slide 30 says nits and nit castings are especially seen at the crown of the head, near the ears, or at the base of the neck.'},
  {t:'The forehead, eyebrows and eyelids', correct:false, why:'Lice in the eyelids or eyebrows is an exclusion from self-care (slide 31), not the typical site.'},
  {t:'Only at the ends of the hair, away from the scalp', correct:false, why:'Slide 30 says lice attach to the hair shaft and nits are especially seen at the crown, ears and neck base, not only at the ends.'},
  {t:'Only on the back of the hands and forearms', correct:false, why:'Slide 29 describes pediculosis as “head lice”, so the hands and forearms are not the site.'}],
 teach:'Lice attach to the hair shaft. A nit is about 1 mm in diameter; black powdery specks may be lice feces.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slides 29–30'},

{id:'o26', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'otc', sub:'lice', concept:'lice-bite',
 tags:['pediculosis'], source:'slide',
 stem:'Lice feed by biting the scalp. What does this cause?',
 options:[
  {t:'An immediate wheal and a papule within 24 hours', correct:true, why:'Slide 30 says lice feed by biting the scalp, causing an immediate wheal and a local papule within 24 hours.'},
  {t:'A vesicle that crusts within 3 days', correct:false, why:'Slide 30 describes only an immediate wheal and a papule within 24 hours, not a vesicle that crusts.'},
  {t:'A violaceous center with spreading redness at the site', correct:false, why:'Slide 16 describes a violaceous center with faint spreading erythema as the early brown recluse bite, not a lice bite.'},
  {t:'Hives on the torso', correct:false, why:'Slide 21 says hives away from the sting site are an allergic reaction, not the effect of a lice bite.'}],
 teach:'Lice bites cause a wheal at once and a local papule within 24 hours.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slide 30'},

{id:'o27', skill:'apply', prof:'Dr. Parsons', multi:true, tier:'new', topic:'otc', sub:'lice', concept:'lice-exclusions',
 tags:['pediculosis','exclusions'], source:'slide',
 stem:'Which findings exclude a patient with head lice from self-treatment? Select all that apply.',
 options:[
  {t:'Lice infection of the eyelids or eyebrows', correct:true, why:'Slides 31, 34 list lice infection of the eyelids or eyebrows as an exclusion from self-treatment.'},
  {t:'Age under 2 months', correct:true, why:'Slides 31, 34 list age under 2 months (permethrins) as an exclusion from self-treatment.'},
  {t:'Secondary infection from scratching', correct:true, why:'Slides 31, 34 list secondary infection from scratching as an exclusion from self-treatment.'},
  {t:'Pregnancy or breastfeeding', correct:true, why:'Slides 31, 34: pregnancy or breastfeeding calls for strong caution; refer to primary care.'},
  {t:'Nits seen at the crown of the head', correct:false, why:'Slide 30 describes nits at the crown of the head as how head lice present, not as an exclusion.'}],
 teach:'Other exclusions: hypersensitivity to chrysanthemums, ragweed or pediculicide ingredients; under 2 years for pyrethrins; active tumors; regional resistance. Slide 31 lists these and the other exclusions.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slides 30–31, 34'},

{id:'o28', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'otc', sub:'lice', concept:'pyrethrins-pbo',
 tags:['pediculosis','pyrethrins'], source:'slide',
 stem:'In synergized pyrethrins, what does “synergized” mean?',
 options:[
  {t:'Piperonyl butoxide slows pyrethrin breakdown', correct:true, why:'Slide 32 says “synergized” means the addition of piperonyl butoxide, which inhibits pyrethrin breakdown.'},
  {t:'Permethrin is added to the pyrethrins', correct:false, why:'Slide 33 presents permethrin (Nix) as a separate product from pyrethrins, not the synergist.'},
  {t:'The product is applied twice as often', correct:false, why:'Synergized refers to an added ingredient, not frequency (slide 32).'},
  {t:'The product kills both nits and lice together', correct:false, why:'Slide 32 says synergized means piperonyl butoxide was added, not that nits and lice are killed together.'}],
 teach:'Pyrethrins block nerve impulse transmission, causing paralysis and death of the insect. They come as shampoos, foams, solutions and gels, and a lice comb must be used.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slide 32'},

{id:'o29', skill:'tell', prof:'Dr. Parsons', tier:'new', topic:'otc', sub:'lice', concept:'pyrethrins-vs-permethrin-retreat',
 tags:['pediculosis'], source:'slide',
 stem:'Which statement about retreating head lice after 7–10 days is correct?',
 options:[
  {t:'Pyrethrins must be retreated; permethrin may be', correct:true, why:'Slide 32: must retreat in 7–10 days. Slide 33: may retreat in 7–10 days if lice or nits are seen.'},
  {t:'Both must be retreated in 7–10 days', correct:false, why:'Permethrin is repeated only if lice or nits are seen (slide 33).'},
  {t:'Neither one is ever retreated', correct:false, why:'Slides 32–33 describe retreatment in 7–10 days, so “never repeated” is wrong.'},
  {t:'Permethrin must be retreated; pyrethrins may be', correct:false, why:'Slide 32 says pyrethrins MUST be retreated and slide 33 says permethrin MAY be, so this reverses them.'}],
 teach:'Both need a lice comb. Permethrin (Nix) is applied as a cream rinse to the scalp for 10 minutes.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slides 32–33'},

{id:'o30', skill:'tell', prof:'Dr. Parsons', tier:'new', topic:'otc', sub:'lice', concept:'lice-age-limits',
 tags:['pediculosis','age'], source:'slide',
 stem:'Which age limits apply to head lice products for self-care?',
 options:[
  {t:'Under 2 years for pyrethrins; under 2 months for permethrins', correct:true, why:'Slide 31 lists under 2 years for pyrethrins and under 2 months for permethrins.'},
  {t:'Under 2 months for pyrethrins; under 2 years for permethrins', correct:false, why:'Slide 31 gives under 2 years for pyrethrins and 2 months for permethrins, so this reverses the limits.'},
  {t:'Under 2 years for both', correct:false, why:'Slide 31 gives under 2 months for permethrins, so under 2 years for both is wrong.'},
  {t:'Under 12 years for both', correct:false, why:'Slide 31 gives under 2 years and under 2 months, not 12 years.'}],
 teach:'Pyrethrins are excluded under 2 years; permethrins under 2 months. Slide 31 exclusions also include hypersensitivity to chrysanthemums, ragweed or pediculicide ingredients.',
 cite:'OTC-Insect-Bites-Pediculosis.pdf slide 31'}
);

/* ==========================================================================
   Week 5: Dr. Parsons, physical assessment and point-of-care testing (POCT).
   Source: POCT-Physical-Assessment.pdf (the NASPA program slides with speaker
   notes, 67 pages). The 9/14 lecture has no transcript. Slide 40 says the
   oximetry calculation is not needed for exams and slide 58 says the Centor
   score is not needed, so neither is tested. TOSCE-Study-Guide.pdf adds that
   pulse may be measured over 15 or 30 seconds (same as slide 31).
   ========================================================================== */
QUESTIONS.push(
{id:'p01', skill:'recall', type:'match', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'pulse-ranges',
 tags:['pulse'], source:'slide',
 stem:'Match each term to its pulse range.',
 left:'Term', right:'Pulse range',
 pairs:[
  {l:'Normal pulse', r:'60–100 beats/min', why:'Slide 30 gives a normal pulse of 60–100 beats/min.'},
  {l:'Tachycardia', r:'Greater than 100 beats/min', why:'Slide 30 defines tachycardia as a pulse above 100 beats/min.'},
  {l:'Bradycardia', r:'Less than 60 beats/min', why:'Slide 30 defines bradycardia as a pulse below 60 beats/min.'}],
 teach:'Pulse is a measure of cardiac function, usually taken by palpating the radial artery.',
 cite:'POCT-Physical-Assessment.pdf slide 30'},

{id:'p02', skill:'recall', prof:'Dr. Parsons', tier:'new', topic:'poct', sub:'vitals', concept:'pulse-technique',
 tags:['pulse'], source:'slide',
 stem:'Which technique is correct for taking a radial pulse?',
 options:[
